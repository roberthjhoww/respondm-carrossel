<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<!-- Versões FIXAS de propósito, mesmo motivo do app-assinaturas: sem fixar, o @babel/standalone
     já pulou de versão e quebrou o transform (tela branca). NÃO remover os números de versão. -->
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.7/babel.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
/* ── Configuração do Firebase ──
   Estas chaves NÃO são segredo (é assim que todo app web Firebase funciona: a proteção real
   está nas regras do Firestore + no login, não em esconder isto). Preencher depois de criar
   o projeto novo no console do Firebase — ver README.md, passo 2. */
var firebaseConfig={
  apiKey:"AIzaSyBpCqN7cke5klHtkFVy9L0-L_2LlKs4-h0",
  authDomain:"respondm-carrossel.firebaseapp.com",
  projectId:"respondm-carrossel",
  storageBucket:"respondm-carrossel.firebasestorage.app",
  messagingSenderId:"361149348347",
  appId:"1:361149348347:web:08c1f9e724bb516ffcb35e"
};
firebase.initializeApp(firebaseConfig);
window.fbAuth=firebase.auth();
window.fbDB=firebase.firestore();

/* ── Endereço do Cloudflare Worker (o "proxy" que esconde as chaves de IA) ──
   Preencher depois do deploy do worker/index.js — ver README.md, passo 3. */
window.WORKER_URL="https://respondm-carrossel-proxy.roberthjhow.workers.dev";
</script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;font-size:14px;line-height:1.5;min-height:100vh;
  --purple:#7447E1;--purple-light:#EDE8FB;--purple-mid:#C4B0F5;
  --yellow:#FEDB00;
  --bg:#F6F4FC;--surface:#FFFFFF;--surface2:#F2EFF9;
  --text:#1A1630;--text2:#6B6487;--text3:#A49EC4;
  --border:#E3DFF4;--border2:#CBC3EF;
  --red:#B82828;--red-bg:#FDEAEA;
  --shadow-sm:0 1px 3px rgba(116,71,225,.07),0 2px 8px rgba(116,71,225,.05);
  --shadow-md:0 4px 24px rgba(116,71,225,.14);
  background:var(--bg);color:var(--text);}
body.dark{
  --bg:#0E0C1A;--surface:#17142B;--surface2:#1E1A33;
  --text:#EAE6FC;--text2:#9990BF;--text3:#5E5885;
  --border:#2A2545;--border2:#3B3560;
  --purple-light:rgba(116,71,225,.22);
  --red-bg:rgba(184,40,40,.18);
  --shadow-sm:0 1px 4px rgba(0,0,0,.4);--shadow-md:0 4px 24px rgba(0,0,0,.5);}
#root{max-width:1080px;margin:0 auto;padding:0 20px 60px;}
input,select,button,textarea{font-family:inherit;}
input:focus,select:focus,textarea:focus{outline:2px solid var(--purple);outline-offset:1px;border-color:var(--purple)!important;}
::-webkit-scrollbar{width:5px;height:5px;}::-webkit-scrollbar-track{background:transparent;}::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px;}
</style>
</head>
<body><div id="root"></div>
<script type="text/babel">
const {useState,useEffect}=React;

// Emails autorizados a usar o app (a segurança real está nas regras do Firestore)
const AUTHORIZED_EMAILS=["roberthjhow@gmail.com","pablonatan.d.r.s@gmail.com"];

// As 4 etapas do wizard, na ordem. O conteúdo de cada etapa é a Fase 2/3 (ainda não construídas).
const STEPS=["Categoria","Tema","Roteiro","Slides"];

function LoginScreen(){
  const [loading,setLoading]=useState(false);
  const [err,setErr]=useState("");
  const ERR_MAP={
    "auth/popup-closed-by-user":"Login cancelado.",
    "auth/popup-blocked":"O navegador bloqueou a janela de login. Permita pop-ups e tente de novo.",
    "auth/unauthorized-domain":"Este domínio não está autorizado no Firebase (ver README.md, passo 2).",
    "auth/network-request-failed":"Sem conexão com a internet."
  };
  async function handleGoogleLogin(){
    setLoading(true);setErr("");
    try{
      const provider=new firebase.auth.GoogleAuthProvider();
      provider.setCustomParameters({prompt:"select_account"});
      await fbAuth.signInWithPopup(provider);
    }catch(e){
      setErr(ERR_MAP[e.code]||("Erro ao entrar: "+(e.message||e.code)));
      setLoading(false);
    }
  }
  return(
    <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
      <div style={{background:"var(--surface)",border:"1.5px solid var(--border)",borderRadius:20,padding:32,width:"100%",maxWidth:380,boxShadow:"var(--shadow-md)"}}>
        <div style={{fontSize:24,fontWeight:800,letterSpacing:"-.03em",marginBottom:4}}>respon<span style={{color:"var(--purple)"}}>DM</span></div>
        <div style={{fontSize:13,color:"var(--text3)",marginBottom:24}}>Gerador de Carrossel</div>
        {err&&<div style={{fontSize:12,color:"var(--red)",background:"var(--red-bg)",border:"1px solid var(--red)",borderRadius:9,padding:"8px 12px",fontWeight:600,marginBottom:14}}>{err}</div>}
        <button onClick={handleGoogleLogin} disabled={loading} style={{display:"flex",alignItems:"center",justifyContent:"center",gap:10,width:"100%",padding:"11px 16px",borderRadius:11,border:"1.5px solid var(--border2)",background:"var(--surface)",color:"var(--text)",fontSize:14,fontWeight:600,cursor:loading?"default":"pointer",fontFamily:"inherit",opacity:loading?.6:1}}>
          <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
          {loading?"Entrando...":"Entrar com Google"}
        </button>
        <div style={{fontSize:11,color:"var(--text3)",marginTop:18,lineHeight:1.6}}>Acesso restrito à equipe da ResponDM.</div>
      </div>
    </div>
  );
}

function DeniedScreen(){
  return(
    <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",padding:20,textAlign:"center"}}>
      <div>
        <div style={{fontSize:18,fontWeight:700,marginBottom:8}}>Conta não autorizada</div>
        <div style={{color:"var(--text2)"}}>Essa conta Google não tem acesso a este app.</div>
      </div>
    </div>
  );
}

function TopBar({step,setStep,user}){
  return(
    <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"24px 0",borderBottom:"1px solid var(--border)",marginBottom:32,flexWrap:"wrap",gap:16}}>
      <div style={{fontSize:20,fontWeight:800,letterSpacing:"-.02em"}}>respon<span style={{color:"var(--purple)"}}>DM</span> <span style={{color:"var(--text3)",fontWeight:600}}>Carrossel</span></div>
      <div style={{display:"flex",gap:4}}>
        {STEPS.map((label,i)=>(
          <button key={label} onClick={()=>setStep(i)} style={{
            padding:"8px 16px",borderRadius:999,border:"1.5px solid "+(step===i?"var(--purple)":"var(--border)"),
            background:step===i?"var(--purple-light)":"transparent",color:step===i?"var(--purple)":"var(--text2)",
            fontWeight:700,fontSize:13,cursor:"pointer",fontFamily:"inherit"
          }}>{i+1}. {label}</button>
        ))}
      </div>
      <div style={{fontSize:12,color:"var(--text3)"}}>{user?.email}</div>
    </div>
  );
}

function StepPlaceholder({name}){
  return(
    <div style={{background:"var(--surface)",border:"1.5px dashed var(--border2)",borderRadius:16,padding:48,textAlign:"center",color:"var(--text3)"}}>
      <div style={{fontSize:16,fontWeight:700,color:"var(--text2)",marginBottom:8}}>Etapa "{name}"</div>
      <div>Fundação (Fase 1) pronta: login, Firestore e Worker conectados.<br/>O conteúdo desta etapa é construído na Fase 2/3, depois da entrevista de fluxo e visual.</div>
    </div>
  );
}

function App(){
  const [authReady,setAuthReady]=useState(false);
  const [user,setUser]=useState(null);
  const [denied,setDenied]=useState(false);
  const [step,setStep]=useState(0);

  useEffect(()=>{
    const unsub=fbAuth.onAuthStateChanged(u=>{
      setAuthReady(true);
      if(u&&u.email&&!AUTHORIZED_EMAILS.includes(u.email.toLowerCase())){
        setDenied(true);setUser(null);
        fbAuth.signOut();
        return;
      }
      if(!u){setUser(null);return;}
      setDenied(false);setUser(u);
    });
    return unsub;
  },[]);

  if(!authReady) return null;
  if(denied) return <DeniedScreen/>;
  if(!user) return <LoginScreen/>;

  return(
    <div>
      <TopBar step={step} setStep={setStep} user={user}/>
      <StepPlaceholder name={STEPS[step]}/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
