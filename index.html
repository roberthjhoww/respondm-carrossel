const PROMPT_BASE=`Você escreve carrosséis para o Instagram da ResponDM (@respon_dm).

SOBRE A RESPONDM (use só o que for verdade, nunca invente recurso):
A ResponDM é um SaaS brasileiro de automação de interações no Instagram pela API oficial da Meta. Recursos reais: automação por comentário (comentou a palavra-chave, recebe DM automática), automação por DM, automação por story, resposta pública automática em comentários, Flow (fluxo de mensagens em canvas com condições, delays, tags e coleta de dados), Link Bio, envio só para seguidores. Sempre trate a marca no feminino: "a ResponDM".

PÚBLICO: criadores de conteúdo, infoprodutores, agências e negócios locais brasileiros que querem crescer no Instagram sem contratar equipe.

TOM: criador experiente que vive isso todos os dias, não empresa se vendendo. Português brasileiro coloquial mas inteligente. Frases curtas. Conversa, não palestra. Autoridade sem arrogância.

PARA QUE ALGORITMO VOCÊ ESCREVE (julho/2026):
- O sinal nº 1 do Instagram é a pessoa ENVIAR o post por DM pra um amigo. Todo carrossel precisa passar no teste do DM: "alguém mandaria isso pra alguém específico?". Se não, refaça.
- O 2º sinal é salvar o post. Conteúdo de referência (checklist, resumo, framework) é o que mais gera save.
- Carrossel ranqueia por taxa de conclusão: cada slide precisa segurar a pessoa até o último.

REGRAS DA CAPA (slide 1):
- A capa anuncia o PAYOFF (o que a pessoa ganha, perde ou descobre), NUNCA o assunto. Errado: "Algoritmo do Instagram em 2026". Certo: "Seu alcance caiu 40% e a causa não é o que você pensa".
- Headline: 6 a 12 palavras, 1 ideia, 1 gatilho psicológico só (curiosidade, FOMO/erro, ganho, defesa, alívio ou descrença/contrário). Empilhar gatilhos na mesma frase vira ruído.
- A palavra que o público pesquisaria sobre o tema deve estar escrita na headline ou no subtítulo.
- Números: prefira ímpares e quebrados ("7 erros", "R$ 4.830") a redondos.
- Subtítulo: 1 frase que neutraliza a objeção principal ("mesmo sem X") ou aumenta a tensão.

REGRAS DE CADA SLIDE INTERNO:
- 1 ideia por slide, com pelo menos um dado, número, mecanismo ou situação concreta.
- Título: até 10 palavras, provoca leitura em vez de descrever.
- Texto de apoio: 1 a 2 frases, 15 a 25 palavras, que adicionam algo novo (nunca continuação óbvia do título). O slide inteiro nunca passa de 40 palavras: a janela de leitura é 1,5 segundo.
- Etiqueta = mini-headline de sinalização ("ERRO 3", "PASSO 2", "DADO"), nunca enfeite.
- Cada slide entrega uma micro-revelação completa E abre curiosidade pro próximo. Quando couber, o texto de apoio termina puxando o próximo slide (ex: "e o pior erro é o próximo").
- ESCALADA: os slides vão do bom pro melhor. O insight mais forte do carrossel fica no FIM do desenvolvimento, nunca no começo.
- Em carrosséis com 5+ slides internos, o ÚLTIMO slide interno é um resumo salvável (checklist ou recap de tudo), com etiqueta RESUMO.
- Em carrosséis de 8+ slides no total, um slide do MEIO pode pedir naturalmente pra salvar o post (nunca no final).
- Quando a ResponDM aparecer como solução, nomeie o mecanismo concreto (ex: "a automação por comentário entrega o PDF no direct"), nunca benefício vago. Ela não precisa aparecer em todo carrossel.

CTA FINAL:
- UM pedido só: comentar UMA palavra-chave em maiúsculas pra receber algo no direct (o post vira demonstração da própria ResponDM).
- O título do CTA fecha o círculo com a promessa da capa (loop-back), não introduz assunto novo.

PROIBIDO (nunca use):
- travessão (o caractere —) em qualquer texto
- "Não é sobre X, é sobre Y" / "No mundo de hoje" / "Mais do que nunca" / "cada vez mais" / "de forma eficiente" / "potencializar" / "alavancar" / "transformar seu negócio" / "escalar seu negócio" / "presença digital" / "jornada do cliente" / "chegou a hora" / "não perca mais tempo" / "solução completa" / "resultados incríveis" / "impacto real"
- benefício sem mecanismo que o explique
- headline que anuncia o assunto em vez do payoff
- conclusão óbvia embalada como insight

DESTAQUE DE TÍTULO (campo "destaque"):
- Em cada título ou headline, quando fizer sentido, escolha UM trecho de 1 a 3 palavras CONSECUTIVAS (copiado exatamente como aparece no título) que carrega o payoff: o número, a palavra de tensão ou o vencedor da frase. Esse trecho ganha cor de destaque no design.
- String vazia quando nenhum trecho merecer. Nunca destaque o título inteiro nem trechos genéricos ("o seu", "que você").

PROMPT DE IMAGEM (campo "prompt_imagem"):
Esse prompt vai ser colado num gerador de imagem. A imagem entra numa MOLDURA dentro do slide, embaixo do texto, e não atrás dele: então ela precisa mostrar algo concreto, que se explique sozinho e que combine com o assunto DAQUELE slide.

Escolha UM dos 4 tipos, pelo que o slide fala:

1. MOCKUP DE INTERFACE. Quando o slide fala de uma tela, menu, botão, aba, painel ou função de um app de terceiro (Instagram, WhatsApp, Google, TikTok, YouTube). Descreva qual app, que parte dele está aberta, e qual elemento aparece em destaque.
2. ÍCONES DE APP EM 3D. Quando o slide fala das plataformas em si, compara serviços, ou lista onde algo passa a funcionar. Descreva os ícones reais (Instagram, TikTok, YouTube, WhatsApp) como objetos 3D de cantos arredondados, flutuando, com sombra suave, sobre fundo limpo.
3. GRÁFICO OU NÚMERO EM 3D. Quando o slide traz dado, porcentagem, comparação numérica, crescimento, queda, ou uma opinião sem tela envolvida. Descreva barras, medidor ou um número grande em 3D, dizendo qual número aparece.
4. PRINT REAL, sem gerar prompt. SOMENTE quando o slide mostra a tela da PRÓPRIA ResponDM. Nesse caso o campo recebe exatamente este texto em português e mais nada: PRINT REAL: este slide mostra a tela da ResponDM. Suba um print de verdade, não gere imagem.

COMO ESCREVER (vale para os tipos 1, 2 e 3):
- Um parágrafo só, escrito em inglês, porque o gerador acerta mais assim.
- Os textos que aparecem DENTRO da imagem vão em PORTUGUÊS, entre aspas, exatamente como devem ser desenhados. Exemplo: a menu item labeled "Trocar áudio".
- No máximo 5 rótulos curtos na imagem inteira, de 1 a 3 palavras cada. Quanto mais texto, mais o gerador entorta a letra.
- NUNCA peça o título do slide, a headline, hashtag, preço ou frase de marketing dentro da imagem: todo o texto do slide é desenhado por fora, por cima da arte.
- Diga o enquadramento e a proporção: tela de celular em vertical, painel de computador em horizontal, ícones e gráficos em quadrado. A interface preenche o quadro, sem margem enorme em volta.
- Diga a luz e o fundo (fundo limpo ou escuro, sombra suave, reflexo). Cada slide pode ter um clima próprio: eles NÃO precisam formar uma série visual.
- Logo de app famoso é permitido e desejável quando o slide fala dele. Proibido inventar logotipo da ResponDM ou de marca que não existe, e proibido marca d'água.
- Sem pessoas famosas. Evite foto de gente genérica: só inclua pessoa se a ação dela for o assunto do slide.

REGRA QUE MANDA EM TODAS: a imagem mostra o ASSUNTO do slide. Se o slide fala de uma função nova, a imagem é aquela função na tela, nunca uma cena decorativa de criador de conteúdo.

ESTRUTURA GERAL: slide 1 é a capa (hook de payoff). Slide 2 reduz ceticismo e abre o loop ("nos próximos X slides você vai ver..."). Desenvolvimento em escalada. Resumo salvável quando houver 5+ slides internos. Último slide é o CTA com loop-back.`;

/* Legenda do post: regras de SEO e algoritmo do Instagram (destilado da skill seo-instagram) */
const PROMPT_LEGENDA=`Você escreve a legenda do post do Instagram da ResponDM (@respon_dm) para um carrossel que JÁ ESTÁ PRONTO.

A legenda tem dois trabalhos ao mesmo tempo: fazer o Instagram entregar o post (algoritmo) e fazer o post ser encontrado por quem pesquisa o assunto (busca do app e Google).

HIERARQUIA DE SINAIS, otimize nesta ordem:
1. Envio por DM é o sinal nº 1 de alcance novo. A legenda precisa dar vontade de mandar pra alguém específico.
2. Salvamento vale mais que curtida. Conteúdo de referência é o que gera save.
3. Comentário com a palavra-chave é o engajamento E dispara a automação da ResponDM.
4. As PALAVRAS da legenda são o motor de SEO. Hashtag hoje é só classificação, não traz seguidor.

PRIMEIRA LINHA (hook):
- Só aparecem cerca de 125 caracteres antes do "...mais". Essa frase precisa ganhar o toque sozinha.
- A palavra-âncora de busca (o termo que o público realmente digitaria sobre esse assunto) aparece nela de forma natural, nunca empilhada.
- Fórmulas que funcionam: quebra de crença, erro ou custo escondido, número e prova, curiosidade com loop aberto, promessa específica com prazo.

ESTRUTURA DA LEGENDA: gancho, fricção (uma tensão curta logo depois do gancho), conteúdo progressivo, recompensa, CTA.
- Parágrafos curtos com quebra de linha. Bloco denso derruba a leitura no celular.
- Emoji no começo de parágrafo e antes do CTA, com função, nunca decoração.
- Tamanho: 800 a 1.500 caracteres, porque a legenda agrega o contexto que não coube na arte.
- A legenda ESPELHA a promessa do carrossel. Nunca cria promessa nova e nunca repete os slides palavra por palavra: ela adiciona o que ficou de fora.

CTA: UM só, no fim, pedindo pra comentar a palavra-chave EXATA que já está no último slide do carrossel.

HASHTAGS: exatamente 5, de nicho (nem genéricas gigantes, nem inventadas), escritas no FIM DA PRÓPRIA LEGENDA.

PROIBIDO:
- travessão (o caractere —) em qualquer lugar do texto
- mais de um CTA
- "espero que tenham gostado", "não perca tempo", "arrasta pro lado" como CTA principal
- empilhar palavra-chave de forma artificial

A marca é sempre "a ResponDM" (feminino).`;

/* ─────────────────────────────────────────────
   Chamada à IA via Worker
   ───────────────────────────────────────────── */
async function chamarIA({system,userText,useWebFetch,schema,maxTokens}){
  const body={
    system,
    messages:[{role:"user",content:userText}],
    thinking:{type:"adaptive"},
    max_tokens:maxTokens||16000,
    output_config:{format:{type:"json_schema",schema}},
  };
  if(useWebFetch) body.tools=[{type:"web_fetch_20260209",name:"web_fetch",max_uses:3}];
  const r=await fetch(WORKER_URL+"/roteiro",{
    method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body),
  });
  let data;
  try{data=await r.json();}catch(e){throw new Error("Resposta inválida do servidor ("+r.status+")");}
  if(!r.ok) throw new Error(data?.error?.message||data?.error||("Erro "+r.status));
  if(data.stop_reason==="refusal") throw new Error("A IA recusou gerar esse conteúdo. Tente reformular o tema.");
  const textos=(data.content||[]).filter(b=>b.type==="text"&&b.text);
  if(!textos.length) throw new Error("A IA não retornou texto. Tente de novo.");
  return JSON.parse(textos[textos.length-1].text);
}

function contextoDoProjeto(p){
  const internos=p.qtdSlides-2;
  let s=`CATEGORIA ESCOLHIDA: ${CATEGORIAS.find(c=>c.id===p.categoria)?.nome||p.categoria}`;
  if(p.tema) s+=`\nTEMA DO CARROSSEL: ${p.tema}`;
  if(p.link) s+=`\nLINK DE MATÉRIA (leia a página com web_fetch e use como base factual do conteúdo): ${p.link}`;
  if(p.textoPronto) s+=`\nTEXTO BASE (adapte ESTE conteúdo para os slides, sem inventar fatos que não estão nele):\n"""\n${p.textoPronto}\n"""`;
  s+=`\nTOTAL DE SLIDES: ${p.qtdSlides} (slide 1 = capa, ${internos} slides internos, último slide = CTA)`;
  return s;
}

function StepRoteiro({projeto,update,next,back}){
  const [busy,setBusy]=useState("");   // "" | "capas" | "roteiro"
  const [err,setErr]=useState("");

  async function gerarCapas(){
    setBusy("capas");setErr("");
    try{
      const out=await chamarIA({
        system:PROMPT_BASE+"\n\n"+PROMPT_CATEGORIA[projeto.categoria],
        userText:contextoDoProjeto(projeto)+`\n\nTAREFA: gere exatamente 3 opções de CAPA para este carrossel, cada uma com um gatilho psicológico DIFERENTE (escolha 3 entre: curiosidade, FOMO/erro, ganho concreto, defesa, alívio, descrença/contrário). Cada headline anuncia o PAYOFF, nunca o assunto, em 6 a 12 palavras, e precisa passar no teste do DM: alguém mandaria essa capa pra um amigo específico. Subtítulo: 1 frase que neutraliza a objeção principal ou aumenta a tensão.`,
        useWebFetch:!!projeto.link.trim(),
        schema:SCHEMA_CAPAS,
        maxTokens:8000,
      });
      update({capas:out.capas||[],capaIdx:null,slides:[],cta:null});
    }catch(e){setErr(String(e.message||e));}
    setBusy("");
  }

  async function gerarRoteiro(){
    const capa=projeto.capas[projeto.capaIdx];
    if(!capa) return;

        useWebFetch:!!projeto.link.trim(),

                <div style={{fontWeight:800,fontSize:15,lineHeight:1.3,marginBottom:6}}>{c.headline}</div>

              <textarea rows={2} style={{...inputStyle,resize:"vertical"}} value={projeto.cta.texto} onChange={e=>update({cta:{...projeto.cta,texto:e.target.value}})}/>

/* ─────────────────────────────────────────────
   Etapa 4 — Slides: motor visual em Canvas (1080×1350)
   Capa e CTA escuros (balões de DM), internos claros.
   ───────────────────────────────────────────── */
/* ══ ENGINE-START (o harness de teste extrai deste marcador até o de fechamento) ══ */
const W=1080,H=1350,DARK="#1A1A2E",ROXO="#7447E1",AMARELO="#FEDB00",LAVANDA="#C4B0F5";

// Tamanhos P/M/G/GG (multiplicadores sobre o tamanho base de cada componente)
const TAM={P:.85,M:1,G:1.15,GG:1.3};
// Fontes de título disponíveis. peso: único peso carregado; escala: compensa a largura
// (condensadas como Anton rendem mais estreitas, então sobem de corpo); lh: line-height.
const FONTES={
  "Anton":{peso:"400",escala:1.12,lh:1.06},
  "Bebas Neue":{peso:"400",escala:1.18,lh:1.02},
  "Inter":{peso:"900",escala:1,lh:1.14},
  "Poppins":{peso:"800",escala:.97,lh:1.16},
  "Montserrat":{peso:"800",escala:.95,lh:1.16},
};
const ESTILO_PADRAO={fonteTitulo:"Anton",tamanhos:{},cores:{}};

function resolverEstilo(projeto,key){
  const g=projeto.estilo||{},o=(projeto.ajustes||{})[key]||{};
  return{
    fonteTitulo:o.fonteTitulo||g.fonteTitulo||"Anton",
    tamanhos:{...(g.tamanhos||{}),...(o.tamanhos||{})},
    cores:{...(g.cores||{}),...(o.cores||{})},
  };
}
function mult(est,comp){return TAM[(est.tamanhos||{})[comp]]||1;}
function corClara(hex){
  const m=/^#?([0-9a-f]{6})$/i.exec(String(hex||""));if(!m)return false;
  const n=parseInt(m[1],16),r=n>>16,g=(n>>8)&255,b=n&255;
  return (r*299+g*587+b*114)/1000>150;
}

// Marca quais palavras do título pertencem ao trecho de destaque (comparação sem pontuação)
function marcarDestaque(txt,destaque){
  const norm=w=>String(w).toLowerCase().replace(/[^\p{L}\p{N}%]/gu,"");
  const words=String(txt||"").trim().split(/\s+/);
  const D=String(destaque||"").trim().split(/\s+/).map(norm).filter(Boolean);
  const marks=words.map(()=>false);
  if(D.length){
    for(let i=0;i<=words.length-D.length;i++){
      let ok=true;
      for(let j=0;j<D.length;j++) if(norm(words[i+j])!==D[j]){ok=false;break;}
      if(ok){for(let j=0;j<D.length;j++)marks[i+j]=true;break;}
    }
  }
  return marks;
}

function rr(ctx,x,y,w,h,r){
  r=Math.min(r,h/2,w/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
function quebrar(ctx,txt,maxW){
  const words=String(txt||"").trim().split(/\s+/);const lines=[];let cur="";
  for(const w of words){const t=cur?cur+" "+w:w;
    if(ctx.measureText(t).width>maxW&&cur){lines.push(cur);cur=w;}else cur=t;}
  if(cur)lines.push(cur);
  return lines;
}
// Ajusta o corpo do TÍTULO na fonte escolhida até caber em maxLines. base/min em px "Inter";
// a escala da fonte compensa condensadas. Retorna o px final, as linhas e o line-height.
function ajustarFonteTit(ctx,est,txt,maxW,base,min,maxLines){
  const f=FONTES[est.fonteTitulo]||FONTES.Anton;
  const font=s=>f.peso+" "+s+"px '"+est.fonteTitulo+"'";
  let px=Math.round(base*f.escala);const minPx=Math.round(min*f.escala);
  while(px>minPx){ctx.font=font(px);if(quebrar(ctx,txt,maxW).length<=maxLines)break;px-=4;}
  ctx.font=font(px);
  return {px,lines:quebrar(ctx,txt,maxW),lh:f.lh,font:font(px)};
}
function desenharLinhas(ctx,lines,x,y,lineH,align){
  ctx.textAlign=align||"left";
  lines.forEach((l,i)=>ctx.fillText(l,x,y+i*lineH));
  ctx.textAlign="left";
  return y+lines.length*lineH;
}
// Desenha o título palavra a palavra, pintando as palavras marcadas na cor de destaque.
// marks segue a ordem das palavras do texto que gerou as linhas (mesma quebra).
function desenharLinhasT(ctx,lines,marks,x,y,lineH,align,corBase,corDestaque){
  ctx.textAlign="left";
  const sp=ctx.measureText(" ").width;
  let wi=0;
  lines.forEach((linha,li)=>{
    const words=linha.split(" ");
    let cx=align==="center"?x-ctx.measureText(linha).width/2:x;
    const ly=y+li*lineH;
    for(const wd of words){
      ctx.fillStyle=marks[wi]?corDestaque:corBase;
      ctx.fillText(wd,cx,ly);
      cx+=ctx.measureText(wd).width+sp;
      wi++;
    }
  });
  ctx.fillStyle=corBase;
  return y+lines.length*lineH;
}
function pill(ctx,cx,y,texto,bg,fg,size,center){
  ctx.font="800 "+size+"px Inter";
  const tw=ctx.measureText(texto).width,padX=size*1.2,h=size*2.2;
  const w=tw+padX*2,x=center?cx-w/2:cx;
  ctx.fillStyle=bg;rr(ctx,x,y,w,h,h/2);ctx.fill();
  ctx.fillStyle=fg;ctx.textBaseline="middle";ctx.textAlign="center";
  ctx.fillText(texto,x+w/2,y+h/2+size*0.06);
  ctx.textBaseline="alphabetic";ctx.textAlign="left";
  return {x,w,h};
}
function balaoDigitando(ctx,cx,y,center){
  const w=190,h=84,x=center?cx-w/2:cx;
  ctx.fillStyle=ROXO;rr(ctx,x,y,w,h,42);ctx.fill();
  ctx.beginPath();ctx.moveTo(x+18,y+h-4);ctx.lineTo(x-6,y+h+22);ctx.lineTo(x+52,y+h-4);ctx.closePath();ctx.fill();
  ctx.fillStyle="rgba(255,255,255,.95)";
  for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(x+w/2+(i-1)*34,y+h/2,9,0,7);ctx.fill();}
}
function fundoFoto(ctx,img,forte){
  const s=Math.max(W/img.width,H/img.height);
  const dw=img.width*s,dh=img.height*s;
  ctx.drawImage(img,(W-dw)/2,(H-dh)/2,dw,dh);
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,"rgba(26,26,46,"+(forte?.55:.45)+")");
  g.addColorStop(.55,"rgba(26,26,46,"+(forte?.8:.7)+")");
  g.addColorStop(1,"rgba(26,26,46,.95)");
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  // Vinheta: escurece as bordas pra foto nunca ficar "seca" atrás do texto
  const v=ctx.createRadialGradient(W/2,H*.44,H*.3,W/2,H/2,H*.85);
  v.addColorStop(0,"rgba(26,26,46,0)");
  v.addColorStop(1,"rgba(26,26,46,.5)");
  ctx.fillStyle=v;ctx.fillRect(0,0,W,H);
}
// Frame de print no estilo do card do canal do WhatsApp (HTML UTEIS/CANAL WHATSAPP):
// fundo quase preto, borda roxa fina e cantos arredondados. No modo "recortado" ele arredonda
// só em cima e fica sem borda embaixo, porque vaza pro rodapé do slide em vez de flutuar.
function caminhoFrame(ctx,x,y,w,h,r,inteiro){
  ctx.beginPath();
  ctx.moveTo(x,y+h);
  ctx.lineTo(x,y+r);
  ctx.arcTo(x,y,x+r,y,r);
  ctx.lineTo(x+w-r,y);
  ctx.arcTo(x+w,y,x+w,y+r,r);
  if(inteiro){
    ctx.lineTo(x+w,y+h-r);
    ctx.arcTo(x+w,y+h,x+w-r,y+h,r);
    ctx.lineTo(x+r,y+h);
    ctx.arcTo(x,y+h,x,y+h-r,r);
  }else{
    ctx.lineTo(x+w,y+h);
  }
}
function frameFoto(ctx,img,x,y,w,h,inteiro){
  const R=26;
  ctx.save();
  ctx.shadowColor="rgba(8,4,24,.5)";ctx.shadowBlur=44;ctx.shadowOffsetY=16;
  ctx.fillStyle="#0A0118";
  caminhoFrame(ctx,x,y,w,h,R,inteiro);ctx.closePath();ctx.fill();
  ctx.restore();

  ctx.save();
  caminhoFrame(ctx,x,y,w,h,R,inteiro);ctx.closePath();ctx.clip();
  // recortado preenche o frame (cover); inteiro mostra a imagem toda, sem cortar nada (contain)
  const s=inteiro?Math.min(w/img.width,h/img.height):Math.max(w/img.width,h/img.height);
  const dw=img.width*s,dh=img.height*s;
  ctx.drawImage(img,x+(w-dw)/2,y+(h-dh)/2,dw,dh);
  ctx.restore();

  ctx.strokeStyle="rgba(139,92,246,.45)";ctx.lineWidth=3;
  caminhoFrame(ctx,x+1.5,y+1.5,w-3,h-(inteiro?3:0),R,inteiro);
  if(inteiro)ctx.closePath();
  ctx.stroke();  // sem closePath no recortado = sem linha embaixo
}
// Espaço mínimo que o print sempre recebe, pra ele nunca sumir calado como acontecia no card 4:3
const FRAME_MIN=330;
function frameAuto(ctx,img,yTop,inteiro){
  const yFim=H-108;
  let x=96,w=W-2*96,h=yFim-yTop;
  if(h<FRAME_MIN){h=FRAME_MIN;yTop=yFim-h;}
  if(inteiro){
    // o frame assume a proporção da imagem, então nada é cortado e não sobra tarja preta:
    // print largo usa a largura toda, print vertical estreita o frame e centraliza
    const prop=img.height/img.width;
    if(w*prop<=h) h=Math.round(w*prop);
    else{w=Math.round(h/prop);x=Math.round((W-w)/2);}
  }
  frameFoto(ctx,img,x,yTop,w,h,inteiro);
}
function gridEscuro(ctx){
  ctx.strokeStyle="rgba(196,176,245,0.06)";ctx.lineWidth=1;
  for(let x=0;x<=W;x+=44){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
  for(let y=0;y<=H;y+=44){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
}
function pontosClaros(ctx){
  ctx.fillStyle="rgba(116,71,225,0.10)";
  for(let x=44;x<W;x+=44)for(let y=44;y<H;y+=44){ctx.beginPath();ctx.arc(x,y,2,0,7);ctx.fill();}
}
function corEtiqueta(et,accent){
  const up=String(et||"").toUpperCase();
  if(["MITO","ERRO","ANTES","CUSTO"].some(k=>up.startsWith(k))) return {bg:"#E53935",fg:"#fff"};
  if(["APLIQUE","CONTEXTO","RESUMO"].some(k=>up.startsWith(k))) return {bg:DARK,fg:"#fff"};
  if(["DICA","PERGUNTA","CRENÇA"].some(k=>up.startsWith(k))) return {bg:LAVANDA,fg:DARK};
  return {bg:accent.bg,fg:accent.fg};
}
function metaBar(ctx,idx,total,accent,dark,semSeta){
  ctx.font="600 28px Inter";
  ctx.fillStyle=dark?"rgba(255,255,255,.6)":"#A49EC4";
  ctx.fillText(String(idx+1).padStart(2,"0")+"/"+String(total).padStart(2,"0"),80,H-58);
  // Fileira de pontos (ref do Studio): quadradinhos, ativo vira losango na cor de acento
  const gap=36,y=H-68,x0=W/2-(total-1)*gap/2;
  for(let i=0;i<total;i++){
    const x=x0+i*gap;
    if(i===idx){
      ctx.fillStyle=accent.bg;
      ctx.save();ctx.translate(x,y);ctx.rotate(Math.PI/4);ctx.fillRect(-8.5,-8.5,17,17);ctx.restore();
    }else{
      ctx.fillStyle=dark?"rgba(255,255,255,.3)":"rgba(26,22,48,.22)";
      ctx.fillRect(x-5,y-5,10,10);
    }
  }
  if(!semSeta){
    ctx.font="800 30px Inter";ctx.fillStyle=dark?AMARELO:ROXO;ctx.textAlign="right";
    ctx.fillText(idx===0?"ARRASTA →":"→",W-80,H-58);ctx.textAlign="left";
  }
}
function topo(ctx,chip,accent,dark){
  ctx.font="600 28px Inter";
  ctx.fillStyle=dark?"rgba(255,255,255,.65)":"#A49EC4";
  ctx.fillText("@respon_dm",80,106);
  if(!chip)return; // chip da categoria só na capa: repetido nos 8 slides ele não informa nada
  ctx.font="800 24px Inter";
  const tw=ctx.measureText(chip).width,padX=28,h=52,w=tw+padX*2,x=W-80-w;
  ctx.fillStyle=accent.bg;rr(ctx,x,72,w,h,26);ctx.fill();
  ctx.fillStyle=accent.fg;ctx.textBaseline="middle";ctx.textAlign="center";
  ctx.fillText(chip,x+w/2,72+h/2+1);
  ctx.textBaseline="alphabetic";ctx.textAlign="left";
}

function desenharSlide(ctx,sp,opts){
  const {idx,total,chip,foto,modo}=opts;
  const est=opts.estilo||ESTILO_PADRAO,cores=est.cores||{};
  let accent=opts.accent;
  if(cores.acento)accent={bg:cores.acento,fg:corClara(cores.acento)?DARK:"#FFFFFF"};
  const fotoFundo=(foto&&(!modo||modo==="fundo"))?foto:null;
  const fotoFixa=(foto&&(modo==="fixa"||modo==="inteira"))?foto:null;
  const inteira=modo==="inteira";
  const tipoDark=sp.tipo==="capa"||sp.tipo==="cta";
  const bg=cores.fundo||(tipoDark?DARK:"#FFFFFF");
  const claro=corClara(bg)&&!fotoFundo;
  const corTitulo=cores.titulo||(claro?"#1A1630":"#FFFFFF");
  const corTexto=cores.texto||(claro?"#4A4A4A":LAVANDA);
  const corDestaque=claro?(corClara(accent.bg)?"#B8860B":accent.bg):AMARELO;
  ctx.clearRect(0,0,W,H);

  if(sp.tipo==="capa"){
    topo(ctx,idx===0?chip:"",accent,!claro);
    const T=String(sp.headline||"").toUpperCase();
    const marks=marcarDestaque(T,String(sp.destaque||"").toUpperCase());
    const subPx=Math.round(38*mult(est,"subtitulo")),subLH=Math.round(subPx*1.47);
    if(fotoFundo){
      // Composição centralizada da ref: título + sub + pill "Arrasta para o lado ›"

      const lineH=Math.round(t.px*t.lh);
      ctx.font="500 "+subPx+"px Inter";
      const subLines=quebrar(ctx,sp.sub,820);
      const blocoH=t.lines.length*lineH+44+subLines.length*subLH+64+90;
      const y=Math.max(320,180+(H-330-blocoH)/2);
      ctx.font=t.font;
      const fimT=desenharLinhasT(ctx,t.lines,marks,W/2,y+t.px,lineH,"center",corTitulo,corDestaque);
      ctx.font="500 "+subPx+"px Inter";ctx.fillStyle=corTexto;
      const fimS=desenharLinhas(ctx,quebrar(ctx,sp.sub,820),W/2,fimT+44,subLH,"center");
      pill(ctx,W/2,fimS+38,"Arrasta para o lado  ›",ROXO,"#FFFFFF",34,true);
    }else{
      balaoDigitando(ctx,80,190,false);
      const t=ajustarFonteTit(ctx,est,T,920,(fotoFixa?70:88)*mult(est,"titulo"),46,fotoFixa?3:5);
      const lineH=Math.round(t.px*t.lh);
      const yT=fotoFixa?320:470;
      ctx.font=t.font;
      const fim=desenharLinhasT(ctx,t.lines,marks,80,yT+t.px,lineH,"left",corTitulo,corDestaque);
      ctx.font="500 "+subPx+"px Inter";ctx.fillStyle=corTexto;
      const fimS=desenharLinhas(ctx,quebrar(ctx,sp.sub,880),80,fim+34,subLH);
      if(fotoFixa)frameAuto(ctx,fotoFixa,fimS+44,inteira);
    }
    metaBar(ctx,idx,total,accent,!claro);
    return;
  }

  if(sp.tipo==="cta"){
    topo(ctx,idx===0?chip:"",accent,!claro);
    const T=String(sp.titulo||"").toUpperCase();
    const marks=marcarDestaque(T,String(sp.destaque||"").toUpperCase());
    if(!fotoFixa)balaoDigitando(ctx,W/2,240,true);
    const t=ajustarFonteTit(ctx,est,T,900,(fotoFixa?58:76)*mult(est,"titulo"),44,fotoFixa?3:4);
    const lineH=Math.round(t.px*t.lh);
    const yT=fotoFixa?240:430;
    ctx.font=t.font;
    const fim=desenharLinhasT(ctx,t.lines,marks,W/2,yT+t.px,lineH,"center",corTitulo,corDestaque);
    const corpoPx=Math.round(40*mult(est,"texto"));
    ctx.font="400 "+corpoPx+"px Inter";ctx.fillStyle=corTexto;
    const fim2=desenharLinhas(ctx,quebrar(ctx,sp.texto,860),W/2,fim+40,Math.round(corpoPx*1.5),"center");
    ctx.font="700 30px Inter";ctx.fillStyle=claro?"#6B6487":"rgba(255,255,255,.7)";ctx.textAlign="center";
    const yCom=fotoFixa?fim2+64:Math.max(fim2+70,880);
    ctx.fillText("COMENTA AÍ EMBAIXO 👇",W/2,yCom);
    const kw=pill(ctx,W/2,yCom+30,String(sp.keyword||"").toUpperCase(),AMARELO,DARK,Math.round(60*mult(est,"keyword")),true);
    if(fotoFixa)frameAuto(ctx,fotoFixa,yCom+30+kw.h+40,inteira);
    metaBar(ctx,idx,total,accent,!claro,true);

  }

  // Slide interno
  ctx.fillStyle=accent.bg;ctx.fillRect(0,0,14,H);
  topo(ctx,idx===0?chip:"",accent,!claro);

  const mx=96;
  const etiq=String(sp.etiqueta||"").trim();
  const T=String(sp.titulo||"").toUpperCase();
  const marks=marcarDestaque(T,String(sp.destaque||"").toUpperCase());
  const etiqPx=Math.round(30*mult(est,"etiqueta")),etiqH=Math.round(etiqPx*2.2)+58;

  // Mede o bloco inteiro antes de desenhar, pra distribuir na vertical (evita slide com metade vazia)
  const t=ajustarFonteTit(ctx,est,T,W-mx-90,(fotoFixa?56:64)*mult(est,"titulo"),36,fotoFixa?3:4);
  const lineHT=Math.round(t.px*t.lh);
  let corpo=Math.round(38*mult(est,"texto")),lineH=Math.round(corpo*1.5);
  ctx.font="400 "+corpo+"px Inter";
  let linhas=quebrar(ctx,sp.texto,W-mx-90);
  const alturaBloco=()=> (etiq?etiqH:30)+t.px+t.lines.length*lineHT+96+corpo+linhas.length*lineH;
  const tetoTexto=fotoFixa?(H-108-FRAME_MIN-56-190):940;
  if(alturaBloco()>tetoTexto){corpo=Math.round((fotoFixa?30:32)*mult(est,"texto"));lineH=Math.round(corpo*1.5);ctx.font="400 "+corpo+"px Inter";linhas=quebrar(ctx,sp.texto,W-mx-90);}

  // Com imagem fixa o texto sobe pro topo; sem imagem, centraliza na vertical
  let y=fotoFixa?190:200+Math.max(0,(960-alturaBloco())*0.35);
  if(etiq){
    const c=cores.etiqueta
      ? {bg:cores.etiqueta,fg:corClara(cores.etiqueta)?DARK:"#FFFFFF"}
      : corEtiqueta(etiq,accent);
    pill(ctx,mx,y,etiq.toUpperCase(),c.bg,c.fg,etiqPx,false);
    y+=etiqH;
  }else y+=30;

  ctx.font=t.font;
  const fimTitulo=desenharLinhasT(ctx,t.lines,marks,mx,y+t.px,lineHT,"left",corTitulo,corDestaque);

  ctx.fillStyle=accent.bg;rr(ctx,mx,fimTitulo+26,150,10,5);ctx.fill();

  ctx.font="400 "+corpo+"px Inter";
  ctx.fillStyle=corTexto;
  const fimTexto=desenharLinhas(ctx,linhas,mx,fimTitulo+96+corpo,lineH);

  if(fotoFixa)frameAuto(ctx,fotoFixa,fimTexto+50,inteira);

  metaBar(ctx,idx,total,accent,!claro);
}

function montarSlides(projeto){
  const capa=projeto.capaIdx!=null?projeto.capas[projeto.capaIdx]:null;
  if(!capa||!projeto.cta||!projeto.slides.length) return [];
  const list=[{key:"capa",tipo:"capa",headline:capa.headline,sub:capa.subtitulo,destaque:capa.destaque||"",prompt_imagem:capa.prompt_imagem||""}];
  projeto.slides.forEach((s,i)=>list.push({key:"s"+i,tipo:"interno",etiqueta:s.etiqueta,titulo:s.titulo,texto:s.texto,destaque:s.destaque||"",prompt_imagem:s.prompt_imagem||""}));
  list.push({key:"cta",tipo:"cta",titulo:projeto.cta.titulo,texto:projeto.cta.texto,keyword:projeto.cta.palavra_chave,destaque:projeto.cta.destaque||"",prompt_imagem:projeto.cta.prompt_imagem||""});
  return list;
}

const imgCache={};
function loadImage(dataURL){
  if(imgCache[dataURL]) return Promise.resolve(imgCache[dataURL]);
  return new Promise((res,rej)=>{
    const img=new Image();
    img.onload=()=>{imgCache[dataURL]=img;res(img);};
    img.onerror=rej;
    img.src=dataURL;
  });
}
function promptPadrao(sp,projeto){
  if(sp.prompt_imagem)return sp.prompt_imagem;
  const assunto=sp.tipo==="interno"?sp.titulo:(projeto.tema||sp.headline||sp.titulo||"");
  return "Realistic app interface mockup about: "+assunto+". Show the relevant screen or app icons as the subject, filling the frame. Any on-screen label must be short and in Portuguese, in quotes. Clean background, soft shadow, studio lighting. No slide headline, no marketing text, no watermark.";
}

function coresPadrao(tipo,accent,etiqueta){
  const dark=tipo!=="interno";
  return {fundo:dark?DARK:"#FFFFFF",titulo:dark?"#FFFFFF":"#1A1630",texto:dark?"#C4B0F5":"#4A4A4A",acento:accent.bg,

function StepSlides({projeto,update,fotos,setFotos,back}){

  const [escopo,setEscopo]=useState("slide"); // "slide" | "global"

  const specs=montarSlides(projeto);

          ...["800 60px Inter","700 30px Inter","600 28px Inter","500 38px Inter","400 38px Inter"].map(f=>document.fonts.load(f)),
          ...[...fams].map(f=>document.fonts.load((FONTES[f]||FONTES.Anton).peso+" 90px '"+f+"'")),

      }catch(e){}
      const urls=[];

        const foto=fotos[sp.key];
        let img=null;
        if(foto){try{img=await loadImage(foto.data);}catch(e){}}
        desenharSlide(cv.getContext("2d"),sp,{idx:i,total:specs.length,accent:cat.accent,chip:cat.chip,foto:img,modo:foto?foto.modo:null,estilo:resolverEstilo(projeto,sp.key)});
        urls.push(cv.toDataURL("image/png"));
      }
      if(vivo){setThumbs(urls);setRenderizando(false);}
    })();
    return()=>{vivo=false;};
  },[JSON.stringify(projeto.slides),JSON.stringify(projeto.cta),projeto.capaIdx,JSON.stringify(projeto.capas),projeto.categoria,fotos,JSON.stringify(projeto.estilo),JSON.stringify(projeto.ajustes)]);

  // Modo padrão da imagem: capa e CTA usam a foto como fundo, internos como card fixo 4:3
  function modoPadrao(tipo){return tipo==="interno"?"fixa":"fundo";}
  function guardarFoto(dataURL){
    const key=specs[sel].key;
    setFotos({...fotos,[key]:{data:dataURL,modo:(fotos[key]||{}).modo||modoPadrao(specs[sel].tipo)}});
  }
  async function gerarFotoIA(){
    if(sel==null) return;
    setBusyFoto(true);setErr("");
    try{
      const r=await fetch(WORKER_URL+"/imagem",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({prompt:promptFoto})});
      const data=await r.json();
      if(!r.ok) throw new Error(data?.error?.message||("Erro "+r.status));
      const parts=data?.candidates?.[0]?.content?.parts||[];
      const part=parts.find(p=>(p.inlineData&&p.inlineData.data)||(p.inline_data&&p.inline_data.data));
      if(!part) throw new Error("A IA não retornou imagem. Tente ajustar o prompt.");
      const inline=part.inlineData||part.inline_data;
      guardarFoto("data:"+(inline.mimeType||inline.mime_type||"image/png")+";base64,"+inline.data);

  }

      }).join(`
`);

        system:PROMPT_LEGENDA,

CARROSSEL PRONTO (é este post que a legenda acompanha):
`+roteiro

TAREFA: escreva a legenda completa deste post. A palavra-chave do CTA é `

        schema:SCHEMA_LEGENDA,

    }).catch(()=>setErr("Não consegui copiar. Selecione o texto e use Ctrl+C."));
  }
  function baixarSlide(i){

    const blob=await zip.generateAsync({type:"blob"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);a.download="carrossel_respondm.zip";a.click();
    URL.revokeObjectURL(a.href);
  }

  return(
    <div>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:12,marginBottom:6}}>
        <h2 style={{fontSize:22,fontWeight:800}}>Seus slides</h2>
        <div style={{display:"flex",gap:10}}>
          <Btn variant="secondary" onClick={()=>setFeed(true)} disabled={renderizando||!thumbs.length}>👁 Ver no feed</Btn>
          <Btn onClick={baixarZip} disabled={renderizando||!thumbs.length}>⬇ Baixar todos (.zip)</Btn>
        </div>
      </div>
      <p style={{color:"var(--text2)",marginBottom:22}}>Clique num slide pra ajustar imagem, tamanhos, cores e fonte. O texto é sempre desenhado em código, nítido.</p>
      <ErrBox msg={err} onClose={()=>setErr("")}/>
      {renderizando&&<div style={{fontSize:13,color:"var(--text3)",marginBottom:12}}>Desenhando slides...</div>}

      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(180px,1fr))",gap:14,marginBottom:22}}>
        {thumbs.map((t,i)=>(
          <div key={i}>
            <img src={t} onClick={()=>setSel(sel===i?null:i)} style={{width:"100%",borderRadius:12,cursor:"pointer",display:"block",
              border:"3px solid "+(sel===i?"var(--purple)":"var(--border)"),boxShadow:"var(--shadow-sm)"}}/>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginTop:4}}>
              <span style={{fontSize:11,fontWeight:700,color:"var(--text3)"}}>{i+1} · {specs[i].tipo.toUpperCase()}{fotos[specs[i].key]?" · 🖼":""}</span>
              <button onClick={()=>baixarSlide(i)} title="Baixar PNG" style={{border:"none",background:"none",cursor:"pointer",fontSize:14,color:"var(--purple)",fontWeight:800}}>⬇</button>
            </div>
          </div>
        ))}
      </div>

      {sel!=null&&specs[sel]&&(()=>{
        const tipo=specs[sel].tipo;
        const f=fotos[specs[sel].key];
        const est=resolverEstilo(projeto,specs[sel].key);
        const cores={...coresPadrao(tipo,cat.accent,specs[sel].etiqueta),...(est.cores||{})};
        const secao={fontSize:12,fontWeight:800,textTransform:"uppercase",letterSpacing:.5,color:"var(--purple)",margin:"18px 0 10px"};
        return(
        <Card style={{marginBottom:22,borderLeft:"5px solid var(--purple)"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:10}}>
            <div style={{fontWeight:800,fontSize:15}}>Ajustes do slide {sel+1}</div>
            <div style={{display:"flex",alignItems:"center",gap:8}}>
              <span style={{fontSize:11,fontWeight:700,color:"var(--text3)"}}>APLICAR EM:</span>
              <Seg value={escopo==="slide"?"Só este slide":"Todos"} options={["Só este slide","Todos"]}
                onChange={v=>setEscopo(v==="Todos"?"global":"slide")}/>
            </div>
          </div>

          {/* Preview do slide ao lado dos controles: sticky pra acompanhar a rolagem do painel */}
          <div style={{display:"flex",gap:22,flexWrap:"wrap",marginTop:4}}>
            <div style={{width:230,flexShrink:0}}>
              <img src={thumbs[sel]} style={{width:"100%",borderRadius:10,display:"block",position:"sticky",top:16,border:"1px solid var(--border)",boxShadow:"var(--shadow-sm)"}}/>
            </div>
            <div style={{flex:1,minWidth:300}}>
          <div style={secao}>Imagem</div>
          {f&&(
            <Field label="Como a imagem entra no slide">
              <Seg value={MODO_NOME[f.modo]||MODO_NOME.fundo} options={["Fundo do slide","Print recortado","Print inteiro"]}
                onChange={v=>setModo(v==="Fundo do slide"?"fundo":(v==="Print inteiro"?"inteira":"fixa"))}/>
              <div style={{fontSize:11,color:"var(--text3)",marginTop:6}}>
                {f.modo==="inteira"
                  ?"A imagem aparece inteira, sem cortar nada. Ideal pra print da tela da ResponDM."
                  :(f.modo==="fundo"
                    ?"A imagem ocupa o slide todo, atrás do texto, com escurecimento e vinheta."
                    :"O print preenche a moldura embaixo do texto e vaza pro rodapé. Pode cortar as bordas da imagem.")}
              </div>
            </Field>
          )}
          {promptFoto.trim().toUpperCase().startsWith("PRINT REAL")&&(
            <div style={{fontSize:13,fontWeight:600,color:"var(--text)",background:"var(--purple-light)",border:"1.5px solid var(--purple-mid)",borderRadius:11,padding:"10px 14px",marginBottom:14}}>
              Este slide mostra a tela da ResponDM. Suba um print de verdade: imagem gerada por IA inventaria uma tela que não existe.
            </div>
          )}
          <Field label="Prompt da imagem (a IA do roteiro já sugere um, edite à vontade)">
            <textarea rows={3} style={{...inputStyle,resize:"vertical"}} value={promptFoto} onChange={e=>setPromptFoto(e.target.value)}/>
          </Field>
          <div style={{display:"flex",gap:10,flexWrap:"wrap"}}>
            <Btn onClick={gerarFotoIA} disabled={busyFoto||promptFoto.trim().toUpperCase().startsWith("PRINT REAL")}>
              {busyFoto?<span><span className="spinner"/>Gerando imagem...</span>:"✨ Gerar com IA"}
            </Btn>
            <label style={{display:"inline-block"}}>
              <span style={{display:"inline-block",padding:"12px 22px",borderRadius:12,fontWeight:700,fontSize:14,cursor:"pointer",border:"1.5px solid var(--border2)",background:"var(--surface)"}}>📁 Subir imagem</span>
              <input type="file" accept="image/*" onChange={subirFoto} style={{display:"none"}}/>
            </label>
            <Btn variant="secondary" onClick={()=>copiar(promptFoto,"prompt")}>
              {copiado==="prompt"?"✓ Copiado":"📋 Copiar prompt"}
            </Btn>
            {f&&<Btn variant="secondary" onClick={removerFoto}>Remover imagem</Btn>}
          </div>
          <div style={{fontSize:11,color:"var(--text3)",marginTop:12}}>As imagens não ficam salvas no rascunho: se fechar a aba, será preciso gerar ou subir de novo.</div>

          <div style={secao}>Tamanhos</div>
          {COMPONENTES[tipo].map(([comp,label])=>(
            <div key={comp} style={{display:"flex",alignItems:"center",gap:12,marginBottom:8}}>
              <span style={{width:110,fontSize:13,fontWeight:600,color:"var(--text2)"}}>{label}</span>
              <Seg value={(est.tamanhos||{})[comp]||"M"} options={["P","M","G","GG"]}
                onChange={v=>setAjuste({tamanhos:{[comp]:v}})}/>
            </div>
          ))}

          <div style={secao}>Fonte dos títulos</div>
          <select value={est.fonteTitulo} onChange={e=>setAjuste({fonteTitulo:e.target.value})} style={{...inputStyle,maxWidth:240}}>
            {Object.keys(FONTES).map(f2=><option key={f2} value={f2}>{f2}</option>)}
          </select>

          <div style={secao}>Cores</div>
          <div style={{display:"flex",gap:18,flexWrap:"wrap",alignItems:"flex-end"}}>
            {[["fundo","Fundo"],["titulo","Título"],["texto","Texto de apoio"],["acento","Acento"]].concat(tipo==="interno"?[["etiqueta","Etiqueta"]]:[]).map(([c,label])=>(
              <label key={c} style={{display:"flex",flexDirection:"column",gap:4,fontSize:12,fontWeight:600,color:"var(--text2)",cursor:"pointer"}}>
                {label}
                <input type="color" value={cores[c]} onChange={e=>setAjuste({cores:{[c]:e.target.value}})}
                  style={{width:64,height:34,border:"1.5px solid var(--border2)",borderRadius:8,padding:2,cursor:"pointer",background:"var(--surface)"}}/>
              </label>
            ))}
            <Btn variant="ghost" onClick={resetarEstilo}>↺ Resetar {escopo==="global"?"ajustes globais":"ajustes deste slide"}</Btn>
          </div>
            </div>
          </div>
        </Card>
        );
      })()}

      {/* ── Legenda do post ── */}
      <Card style={{marginBottom:22,borderLeft:"5px solid var(--yellow)"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:12,marginBottom:projeto.legenda?14:0}}>
          <div>
            <div style={{fontWeight:800,fontSize:15}}>Legenda do post</div>
            <div style={{fontSize:12,color:"var(--text3)",marginTop:2}}>Escrita a partir do carrossel, otimizada pra busca e pro algoritmo.</div>
          </div>
          <Btn variant={projeto.legenda?"secondary":"primary"} onClick={gerarLegenda} disabled={busyLegenda}>
            {busyLegenda?<span><span className="spinner"/>Escrevendo...</span>:(projeto.legenda?"↻ Gerar outra":"✍️ Gerar legenda")}
          </Btn>
        </div>

        {projeto.legenda&&(
          <div>
            <Field label="Legenda completa (já com hook, CTA e hashtags, pronta pra colar)">
              <textarea rows={16} style={{...inputStyle,resize:"vertical",lineHeight:1.6}} value={projeto.legenda.legenda}
                onChange={e=>update({legenda:{...projeto.legenda,legenda:e.target.value}})}/>
            </Field>
            <div style={{display:"flex",gap:10,flexWrap:"wrap",alignItems:"center",marginBottom:18}}>
              <Btn onClick={()=>copiar(projeto.legenda.legenda,"legenda")}>
                {copiado==="legenda"?"✓ Copiado":"📋 Copiar legenda"}
              </Btn>
              <span style={{fontSize:12,color:"var(--text3)"}}>{projeto.legenda.legenda.length} caracteres</span>
            </div>

            <Field label="Texto alternativo do primeiro slide (Configurações avançadas, antes de publicar)">
              <textarea rows={2} style={{...inputStyle,resize:"vertical"}} value={projeto.legenda.alt_text}
                onChange={e=>update({legenda:{...projeto.legenda,alt_text:e.target.value}})}/>
            </Field>
            <Btn variant="secondary" onClick={()=>copiar(projeto.legenda.alt_text,"alt")} style={{marginBottom:18}}>
              {copiado==="alt"?"✓ Copiado":"📋 Copiar alt text"}
            </Btn>

            <div style={{background:"var(--surface2)",borderRadius:12,padding:"12px 16px"}}>
              <div style={{fontSize:11,fontWeight:800,textTransform:"uppercase",letterSpacing:.5,color:"var(--text2)",marginBottom:8}}>
                Palavra-âncora de busca: <span style={{color:"var(--purple)"}}>{projeto.legenda.palavra_ancora}</span>
              </div>
              <div style={{fontSize:11,fontWeight:800,textTransform:"uppercase",letterSpacing:.5,color:"var(--text2)",marginBottom:6}}>Outras primeiras linhas pra testar</div>
              {(projeto.legenda.hooks_alternativos||[]).map((h,i)=>(
                <div key={i} style={{fontSize:13,color:"var(--text2)",padding:"5px 0",display:"flex",gap:8}}>
                  <span style={{color:"var(--text3)",fontWeight:700}}>{i+1}.</span><span>{h}</span>
                </div>
              ))}
            </div>

            {(projeto.cta||{}).palavra_chave&&(
              <div style={{fontSize:12,color:"var(--text2)",marginTop:14,background:"var(--purple-light)",borderRadius:10,padding:"10px 14px"}}>
                Antes de publicar, deixe a automação da palavra <b>{projeto.cta.palavra_chave}</b> criada na ResponDM. Dá pra usar o "Aguardar próximo post" e ela se vincula sozinha quando o post entrar no ar.
              </div>
            )}
          </div>
        )}
      </Card>

      {feed&&<FeedModal thumbs={thumbs} headline={(projeto.capas[projeto.capaIdx]||{}).headline||""} onClose={()=>setFeed(false)}/>}

      <Btn variant="secondary" onClick={back}>← Voltar ao roteiro</Btn>
    </div>
  );
}

/* ─────────────────────────────────────────────
   Meus carrosséis (persistência no Firestore)
   ───────────────────────────────────────────── */
function TelaProjetos({onAbrir,onVoltar,idAtual}){
  const [lista,setLista]=useState(null);
  const [thumbs,setThumbs]=useState({});
  const [err,setErr]=useState("");

  useEffect(()=>{
    let vivo=true;
    fbDB.collection("projetos").orderBy("atualizadoEm","desc").limit(60).get()
      .then(snap=>{if(vivo)setLista(snap.docs.map(d=>({id:d.id,...d.data()})));})
      .catch(e=>{if(vivo){setErr("Não consegui carregar a lista: "+(e.message||e));setLista([]);}});
    return()=>{vivo=false;};
  },[]);

  // A capa de cada carrossel é desenhada pelo mesmo engine dos slides
  useEffect(()=>{
    if(!lista||!lista.length) return;
    let vivo=true;
    (async()=>{
      const fams=new Set(lista.map(p=>((p.estilo||{}).fonteTitulo)||"Anton"));
      try{
        await Promise.all([
          ...[...fams].map(f=>document.fonts.load((FONTES[f]||FONTES.Anton).peso+" 90px '"+f+"'")),
          document.fonts.load("500 38px Inter"),document.fonts.load("600 28px Inter"),
        ]);
      }catch(e){}
      const out={};
      for(const p of lista){
        const capa=(p.capas||[])[p.capaIdx||0];
        if(!capa) continue;
        const cat=CATEGORIAS.find(c=>c.id===p.categoria)||CATEGORIAS[0];
        const cv=document.createElement("canvas");cv.width=W;cv.height=H;
        desenharSlide(cv.getContext("2d"),
          {tipo:"capa",headline:capa.headline,sub:capa.subtitulo,destaque:capa.destaque||""},
          {idx:0,total:p.qtdSlides||8,accent:cat.accent,chip:cat.chip,estilo:resolverEstilo(p,"capa")});
        out[p.id]=cv.toDataURL("image/png");
      }
      if(vivo)setThumbs(out);
    })();
    return()=>{vivo=false;};
  },[lista]);

  async function excluir(p){
    if(!window.confirm("Excluir este carrossel de vez? Não dá pra desfazer.")) return;
    try{
      await fbDB.collection("projetos").doc(p.id).delete();
      setLista(l=>l.filter(x=>x.id!==p.id));
    }catch(e){setErr("Não consegui excluir: "+(e.message||e));}
  }
  function quando(p){
    const d=p.atualizadoEm&&p.atualizadoEm.toDate?p.atualizadoEm.toDate():null;
    if(!d) return "agora há pouco";
    return d.toLocaleDateString("pt-BR")+" às "+d.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
  }

  return(
    <div>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:12,marginBottom:6}}>
        <h2 style={{fontSize:22,fontWeight:800}}>Meus carrosséis</h2>
        <Btn variant="secondary" onClick={onVoltar}>← Voltar ao carrossel atual</Btn>
      </div>
      <p style={{color:"var(--text2)",marginBottom:22}}>Tudo que você escreve é salvo sozinho. As imagens dos slides não ficam salvas ainda: ao reabrir, gere ou suba de novo.</p>
      <ErrBox msg={err} onClose={()=>setErr("")}/>

      {lista===null&&<div style={{color:"var(--text3)",padding:30,textAlign:"center"}}>Carregando...</div>}
      {lista&&lista.length===0&&!err&&(
        <div style={{background:"var(--surface)",border:"1.5px dashed var(--border2)",borderRadius:16,padding:48,textAlign:"center",color:"var(--text3)"}}>
          Nenhum carrossel salvo ainda. Assim que a IA gerar as capas, ele aparece aqui sozinho.
        </div>
      )}

      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(230px,1fr))",gap:16}}>
        {(lista||[]).map(p=>{
          const cat=CATEGORIAS.find(c=>c.id===p.categoria);
          const capa=(p.capas||[])[p.capaIdx||0];
          return(
            <Card key={p.id} selected={p.id===idAtual} style={{padding:12}}>
              {thumbs[p.id]
                ? <img src={thumbs[p.id]} onClick={()=>onAbrir(p)} style={{width:"100%",borderRadius:9,display:"block",cursor:"pointer",border:"1px solid var(--border)"}}/>
                : <div style={{width:"100%",aspectRatio:"1080/1350",borderRadius:9,background:"var(--surface2)"}}/>}
              <div style={{fontSize:13,fontWeight:700,lineHeight:1.35,margin:"10px 0 4px"}}>{capa?capa.headline:"(sem capa)"}</div>
              <div style={{fontSize:11,color:"var(--text3)",marginBottom:10}}>
                {cat?cat.emoji+" "+cat.nome:"?"} · {(p.slides||[]).length+2} slides<br/>{quando(p)}
                {p.id===idAtual?<span style={{color:"var(--purple)",fontWeight:800}}><br/>Aberto agora</span>:null}
              </div>
              <div style={{display:"flex",gap:8}}>
                <Btn style={{padding:"8px 14px",fontSize:13,flex:1}} onClick={()=>onAbrir(p)}>Abrir</Btn>
                <Btn variant="secondary" style={{padding:"8px 12px",fontSize:13}} onClick={()=>excluir(p)} title="Excluir">🗑</Btn>
              </div>
            </Card>
          );
        })}
      </div>
    </div>
  );
}

/* ─────────────────────────────────────────────
   App
   ───────────────────────────────────────────── */

const PROJETO_VAZIO={id:null,categoria:null,tema:"",link:"",textoPronto:"",qtdSlides:8,capas:[],capaIdx:null,slides:[],cta:null,estilo:{fonteTitulo:"Anton",tamanhos:{},cores:{}},ajustes:{},legenda:null};

function App(){
  const [authReady,setAuthReady]=useState(false);
  const [user,setUser]=useState(null);
  const [denied,setDenied]=useState(false);
  const [step,setStep]=useState(0);
  const [tela,setTela]=useState("wizard");        // "wizard" | "projetos"
  const [statusSalvo,setStatusSalvo]=useState("");
  const [fotos,setFotos]=useState({}); // imagens de fundo por slide (só em memória, dataURLs pesam demais pro localStorage e pro Firestore)
  const timerSalvar=useRef(null);
  const ultimoSalvo=useRef("");   // último JSON gravado, evita reescrever o que não mudou
  const idRef=useRef(null);       // id do doc já criado, sincronizado antes do estado
  const salvando=useRef(false);
  const [projeto,setProjeto]=useState(()=>{
    try{const d=localStorage.getItem(DRAFT_KEY);if(d) return {...PROJETO_VAZIO,...JSON.parse(d)};}catch(e){}
    return {...PROJETO_VAZIO};
  });

  useEffect(()=>{
    const unsub=fbAuth.onAuthStateChanged(u=>{
      setAuthReady(true);
      if(u&&u.email&&!AUTHORIZED_EMAILS.includes(u.email.toLowerCase())){
        setDenied(true);setUser(null);
        fbAuth.signOut();
        return;
      }
      if(!u){setUser(null);return;}
      setDenied(false);setUser(u);
    });
    return unsub;
  },[]);

  useEffect(()=>{
    try{localStorage.setItem(DRAFT_KEY,JSON.stringify(projeto));}catch(e){}
  },[projeto]);

  // Autosave no Firestore. Só entra depois que a IA gerou as capas (antes disso o localStorage
  // já cobre) e espera 2,5s parado pra não escrever a cada tecla: a cota do Firebase já estourou
  // uma vez no app de assinaturas por escrita em excesso.
  useEffect(()=>{
    if(!user||!projeto.capas.length) return;
    const snap=JSON.stringify({...projeto,id:null});
    if(snap===ultimoSalvo.current) return;
    clearTimeout(timerSalvar.current);
    timerSalvar.current=setTimeout(()=>salvar(snap),2500);
    return()=>clearTimeout(timerSalvar.current);
  },[projeto,user]);

  async function salvar(snap){
    // Se um save ainda está voando, espera: sem isso dois saves rápidos criariam dois documentos
    if(salvando.current){
      clearTimeout(timerSalvar.current);
      timerSalvar.current=setTimeout(()=>salvar(snap),1500);
      return;
    }
    salvando.current=true;
    setStatusSalvo("salvando");
    const dados={...projeto};
    delete dados.id;
    dados.email=user.email;
    dados.atualizadoEm=firebase.firestore.FieldValue.serverTimestamp();
    try{
      const id=projeto.id||idRef.current;
      if(id){
        await fbDB.collection("projetos").doc(id).set(dados,{merge:true});
      }else{
        dados.criadoEm=firebase.firestore.FieldValue.serverTimestamp();
        const ref=await fbDB.collection("projetos").add(dados);
        idRef.current=ref.id;
        setProjeto(p=>({...p,id:ref.id}));
      }
      ultimoSalvo.current=snap;
      setStatusSalvo("salvo");
    }catch(e){
      setStatusSalvo("erro");
    }
    salvando.current=false;
  }

  function update(patch){setProjeto(p=>({...p,...patch}));}

  function abrirProjeto(p){
    const doc={...p};
    delete doc.atualizadoEm;delete doc.criadoEm;delete doc.email;
    const aberto={...PROJETO_VAZIO,...doc};
    clearTimeout(timerSalvar.current);
    idRef.current=p.id;
    ultimoSalvo.current=JSON.stringify({...aberto,id:null});
    setProjeto(aberto);setFotos({});
    setStep(aberto.slides.length?3:2);
    setStatusSalvo("salvo");setTela("wizard");
  }

  function novo(){
    const naoSalvo=!projeto.id&&!!(projeto.capas.length||projeto.tema.trim());
    if(naoSalvo&&!window.confirm("O carrossel atual ainda não foi salvo. Começar um novo mesmo assim?"))return;
    clearTimeout(timerSalvar.current);
    idRef.current=null;ultimoSalvo.current="";
    setProjeto({...PROJETO_VAZIO});setFotos({});setStep(0);setStatusSalvo("");setTela("wizard");
  }

  if(!authReady) return null;
  if(denied) return <DeniedScreen/>;
  if(!user) return <LoginScreen/>;

  return(
    <div>
      <TopBar step={step} setStep={s=>{setTela("wizard");setStep(s);}} onNovo={novo}
        onProjetos={()=>setTela("projetos")} statusSalvo={statusSalvo}/>
      {tela==="projetos"?(
        <TelaProjetos idAtual={projeto.id} onAbrir={abrirProjeto} onVoltar={()=>setTela("wizard")}/>
      ):(
        <React.Fragment>
          {step===0&&<StepCategoria projeto={projeto} update={update} next={()=>setStep(1)}/>}
          {step===1&&<StepTema projeto={projeto} update={update} next={()=>setStep(2)} back={()=>setStep(0)}/>}
          {step===2&&<StepRoteiro projeto={projeto} update={update} next={()=>setStep(3)} back={()=>setStep(1)}/>}
          {step===3&&<StepSlides projeto={projeto} update={update} fotos={fotos} setFotos={setFotos} back={()=>setStep(2)}/>}
        </React.Fragment>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
