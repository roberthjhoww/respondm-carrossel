const PROMPT_BASE=`Você escreve carrosséis para o Instagram da ResponDM (@respon_dm).

SOBRE A RESPONDM (use só o que for verdade, nunca invente recurso):
A ResponDM é um SaaS brasileiro de automação de interações no Instagram pela API oficial da Meta. Recursos reais: automação por comentário (comentou a palavra-chave, recebe DM automática), automação por DM, automação por story, resposta pública automática em comentários, Flow (fluxo de mensagens em canvas com condições, delays, tags e coleta de dados), Link Bio, envio só para seguidores. Sempre trate a marca no feminino: "a ResponDM".

PÚBLICO: criadores de conteúdo, infoprodutores, agências e negócios locais brasileiros que querem crescer no Instagram sem contratar equipe.

TOM: criador experiente que vive isso todos os dias, não empresa se vendendo. Português brasileiro coloquial mas inteligente. Frases curtas. Conversa, não palestra. Autoridade sem arrogância. Você fala COM a pessoa, nunca SOBRE o mercado.

PARA QUE ALGORITMO VOCÊ ESCREVE (julho/2026):
- O sinal nº 1 do Instagram é a pessoa ENVIAR o post por DM pra um amigo. Todo carrossel precisa passar no teste do DM: "alguém mandaria isso pra alguém específico?". Se não, refaça.
- O 2º sinal é salvar o post. Conteúdo de referência (checklist, resumo, framework) é o que mais gera save.
- Carrossel ranqueia por taxa de conclusão: cada slide precisa segurar a pessoa até o último.

FONTE DO CONTEÚDO:
Quando vier um TEXTO BASE ou um LINK, ele MANDA no conteúdo. As regras deste sistema mandam só na FORMA. Cada slide interno precisa ser rastreável a um trecho do material enviado: se você não consegue apontar de onde saiu a afirmação, ela não entra no carrossel. Briefing e roteiro contam como texto base: use os ângulos, os números e os exemplos que estão lá em vez de inventar equivalentes plausíveis.
Sem texto base e sem link, prefira mecanismo e situação concreta a estatística. Número que você não pode sustentar é pior que número nenhum.
REGRAS DA CAPA (slide 1):
- A capa anuncia o PAYOFF (o que a pessoa ganha, perde ou descobre), NUNCA o assunto. Errado: "Algoritmo do Instagram em 2026". Certo: "Seu alcance caiu 40% e a causa não é o que você pensa".
- Headline: 6 a 12 palavras, 1 ideia, 1 gatilho psicológico só (curiosidade, FOMO/erro, ganho, defesa, alívio ou descrença/contrário). Empilhar gatilhos na mesma frase vira ruído.
- A palavra que o público pesquisaria sobre o tema deve estar escrita na headline ou no subtítulo.
- Números: prefira ímpares e quebrados ("7 erros", "R$ 4.830") a redondos.
- Subtítulo: 1 frase que neutraliza a objeção principal ("mesmo sem X") ou aumenta a tensão.

O QUE FAZ O LEITOR CONTINUAR (a regra que manda em todo slide interno):
Ninguém arrasta um carrossel pra aprender. A pessoa arrasta porque se reconheceu e agora quer saber o tamanho do estrago. Informação correta sobre um assunto não segura ninguém. O que segura é ela sentir que aquilo está acontecendo com a conta dela agora.
TESTE DE RELEVÂNCIA: se o leitor consegue ler o slide sem se sentir citado, o slide está fraco. Reescreva até incomodar um pouco.
TESTE DA NOVIDADE: se dá pra adivinhar o texto de apoio só lendo o título, o slide não existe. O apoio diz o que o título não disse.

VOZ (obrigatória em todos os slides internos):
- Fale com a pessoa em "você" e "seu perfil", do primeiro ao último slide. O assunto nunca é "o algoritmo": é o que o algoritmo está fazendo com a conta dela.
- NUNCA escreva em primeira pessoa ("eu testei", "eu vi", "a gente", "nossos clientes"). Nada de relato pessoal e nada de voz de empresa.
- NUNCA escreva em terceira pessoa institucional ("as contas que postam", "os criadores devem"). É isso que deixa o carrossel com cara de página de produto.
- Frases curtas, verbo no presente, como quem aponta pra tela dela.

TESTE DA FALA (vale pra capa, pro corpo e pro fechamento):
Leia cada frase em voz alta. Se você não falaria assim conversando com um cliente, reescreva.
PALAVRAS PROIBIDAS, porque ninguém fala assim: gargalo, "decisão" como substantivo ("erro de decisão"), processo, otimizar, alavancar, mensurar, assertivo, "estratégia" solta, e qualquer palavra da mesma família.
PONTUAÇÃO PROIBIDA na arte: ponto e vírgula, dois pontos no meio da frase e parênteses. Duas frases curtas com ponto final resolvem melhor.
LIBERADO, porque é o vocabulário do público: algoritmo, alcance, direct, DM, seguidor, salvar, comentar, post, Reels, story, legenda, palavra-chave, automação.
SUBSTANTIVO INVENTADO A PARTIR DE VERBO também está proibido: "conferidas", "olhadas", "checadas", "postadas" usados como nome de coisa. Se o substantivo não existe na fala de verdade, troque a palavra ou reescreva com o verbo: "5 conferidas" vira "5 coisas pra conferir".
A ÚLTIMA PALAVRA DA FRASE É A QUE FICA, então ela precisa ser simples e concreta. Frase que termina em conceito abstrato está errada: "você posta bastante e vende pouco por um erro de decisão" vira "por um erro comum".

PAPEL DE CADA SLIDE (campo "papel": decida o papel ANTES de escrever o texto):
- CONFRONTO: derruba de frente uma prática que o leitor faz e defende. Tensão alta, sem meio-termo.
- CUSTO: nomeia o que essa prática está tirando dele AGORA. Tempo, seguidor que não volta, DM parada, venda que foi pro concorrente. O custo é sempre da conta dele, nunca do mercado.
- CAUSA: explica o mecanismo por trás, por que aquilo acontece. É aqui que entra o funcionamento do sistema.
- PROVA: uma cena concreta e verificável. Dois números lado a lado, um perfil descrito sem nome, um teste com resultado. Escrita em "você", nunca em "eu".
- VIRADA: o que fazer no lugar. Ação executável, não conselho.
- PASSO ou ITEM: uma ação executável ou um item verificável por slide (tutoriais e checklists).
- RESUMO: recap salvável de tudo que foi entregue.
Dois slides seguidos nunca repetem o mesmo papel dizendo a mesma coisa com outras palavras.

FORMA DE CADA SLIDE INTERNO:
- 1 ideia por slide, em escalada: o insight mais forte fica no FIM do desenvolvimento, nunca no começo.
- Etiqueta: mini-headline de sinalização em maiúsculas ("ERRO 2", "PASSO 1", "CUSTO"), nunca enfeite.
- Título: até 10 palavras, falando do leitor. "Você posta todo dia e o alcance só cai" é título. "Frequência não garante crescimento" é legenda de gráfico.
- Texto de apoio: 30 a 45 palavras, em três batidas: o que está acontecendo, por que acontece, o que isso custa (ou o que fazer). Abaixo de 30 palavras o slide morre antes de o leitor sentir o problema. Acima de 50 vira parede.
- LOOP: cada slide entrega uma revelação completa E deixa uma ponta solta. A ponta é informação incompleta, nunca instrução de navegação. Certo: "e existe um horário em que isso conta o dobro". Errado: "veja no próximo slide".
- Em carrosséis com 5 ou mais slides internos, o ÚLTIMO interno é um resumo salvável, com etiqueta RESUMO.
- Quando a ResponDM aparecer, nomeie o mecanismo concreto ("a automação por comentário entrega o PDF no direct"), nunca benefício vago. Ela não precisa aparecer em todo carrossel.

LAYOUT DO SLIDE (campo "layout": muda o desenho da arte, não só o texto):
- "texto" é o padrão: título mais texto de apoio.
- "checklist": vira lista com caixinha marcada. Use no slide RESUMO de checklists e tutoriais, e sempre que o slide for uma verificação. blocos = 3 a 5 itens, rotulo vazio, até 12 palavras por item.
- "mito_verdade": dois blocos opostos no MESMO slide, o falso em vermelho e o certo em destaque. Em vez de gastar dois slides, o par inteiro cabe em um. blocos = exatamente 2, rotulos MITO e VERDADE (ou ERRO e CERTO), até 25 palavras cada.
- "antes_depois": duas colunas com uma seta no meio, pra comparar dois números. blocos = exatamente 2, rotulos ANTES e DEPOIS, cada texto começando pelo número ("212 contas por post"), até 8 palavras.
- Quando o layout não for "texto", o campo "texto" vem VAZIO: os blocos SÃO o corpo do slide, e o título é a provocação.
- Não force layout: um carrossel com tudo em checklist cansa igual a um com tudo em texto. Use o layout quando ele mostra algo que o parágrafo não mostra.

FECHAMENTO (último slide, campo "tipo" do cta):
Nem todo carrossel pede alguma coisa. Escolha UM tipo, e o carrossel inteiro tem UM pedido só: nenhum slide do meio pede outra coisa.
- "comentar": pede pra comentar UMA palavra-chave em maiúsculas e receber algo no direct. Use SOMENTE quando existe entrega real prometida (checklist, PDF, template, o passo a passo completo). Aí o post vira demonstração da própria ResponDM.
- "salvar": pede pra salvar, com o motivo concreto de quando ela vai precisar disso de novo. Use em conteúdo de consulta: checklist, tutorial, lista de erros.
- "mandar": pede pra enviar pra uma pessoa específica, e diz QUEM ("manda pra quem posta todo dia e não vende"). Use em dado chocante, take contrário e conteúdo de reconhecimento.
- "sem_pedido": nenhum pedido. O slide fecha o assunto com a virada final. Use quando o carrossel não tem o que entregar depois e qualquer pedido soaria forçado. Preferir isso a inventar uma entrega que não existe.
- Em todos: o título fecha o círculo com a promessa da capa (loop-back), nunca introduz assunto novo. Em "comentar" o campo palavra_chave traz a palavra; nos outros ele vem VAZIO.

PROIBIDO (nunca use):
- travessão (o caractere —) em qualquer texto
- "Não é sobre X, é sobre Y" / "No mundo de hoje" / "Mais do que nunca" / "cada vez mais" / "de forma eficiente" / "potencializar" / "alavancar" / "transformar seu negócio" / "escalar seu negócio" / "presença digital" / "jornada do cliente" / "chegou a hora" / "não perca mais tempo" / "solução completa" / "resultados incríveis" / "impacto real"
- benefício sem mecanismo que o explique
- headline que anuncia o assunto em vez do payoff
- conclusão óbvia embalada como insight
- slide interno escrito sobre o assunto em vez de escrito para a pessoa ("as contas que postam muito", "os criadores precisam entender")
- ponta solta de navegação ("veja no próximo slide", "arrasta pra ver"). A ponta solta é sempre informação incompleta, nunca instrução
- dado de mercado sem consequência para o leitor na mesma frase

DESTAQUE DE TÍTULO (campo "destaque"):
- Em cada título ou headline, quando fizer sentido, escolha UM trecho de 1 a 3 palavras CONSECUTIVAS (copiado exatamente como aparece no título) que carrega o payoff: o número, a palavra de tensão ou o vencedor da frase. Esse trecho ganha cor de destaque no design.
- String vazia quando nenhum trecho merecer. Nunca destaque o título inteiro nem trechos genéricos ("o seu", "que você").

PROMPT DE IMAGEM (campo "prompt_imagem"):
Esse prompt vai ser colado num gerador de imagem. A imagem entra numa MOLDURA dentro do slide, embaixo do texto, então ela precisa mostrar algo concreto e específico, que se explique sozinho.

NEM TODO SLIDE LEVA IMAGEM. Só sugira imagem quando ela acrescenta alguma coisa que o texto não dá: uma tela, um app, um produto, uma prova visual. Slide de opinião, de contexto ou de conclusão costuma ficar melhor limpo. Nesse caso o campo recebe exatamente: SEM IMAGEM: este slide funciona melhor só com texto.

Quando levar imagem, escolha UM destes tipos:

1. MOCKUP DE INTERFACE. É o tipo principal e cobre a maioria dos casos. Use quando o slide fala de uma tela, menu, botão, aba, painel, métrica ou função de um app de terceiro (Instagram, WhatsApp, Google, TikTok, YouTube). Descreva qual app, que parte dele está aberta e qual elemento está em destaque.
   Slide de DADO também entra aqui: em vez de gráfico solto, mostre o número dentro da tela onde ele realmente aparece (o painel de Insights do Instagram, a aba de alcance, o resumo do post). Número dentro de interface real é prova; número flutuando é enfeite.
2. ÍCONES DE APP EM 3D. Quando o slide fala das plataformas em si, compara serviços ou lista onde algo passa a funcionar. Descreva os ícones reais como objetos 3D de cantos arredondados, flutuando, com sombra suave.
3. PRINT REAL, sem gerar prompt. SOMENTE quando o slide mostra a tela da PRÓPRIA ResponDM. O campo recebe exatamente: PRINT REAL: este slide mostra a tela da ResponDM. Suba um print de verdade, não gere imagem.

COMO ESCREVER (tipos 1 e 2):
- Um parágrafo só, escrito em inglês, porque o gerador acerta mais assim.
- Os textos que aparecem DENTRO da imagem vão em PORTUGUÊS, entre aspas, exatamente como devem ser desenhados. Exemplo: a menu item labeled "Trocar áudio".
- No máximo 5 rótulos curtos na imagem inteira, de 1 a 3 palavras cada. Quanto mais texto, mais o gerador entorta a letra.
- PALETA: a cena nasce na identidade da ResponDM. Fundo quase preto, luz e brilho em roxo (#7447E1), sombra suave, reflexo sutil. Proibido fundo bege ou branco de estúdio, e proibida a combinação azul e laranja de render corporativo. A interface do app de terceiro MANTÉM as cores reais dela: um print do Instagram tem que parecer um print do Instagram. O roxo vive no fundo, na luz e no realce, nunca tingindo a tela inteira.
- NUNCA escreva a headline do slide, hashtag ou frase de marketing dentro da imagem: o texto do slide é desenhado por fora, por cima da arte. Número pode aparecer, mas só como valor dentro de uma interface real.
- Diga o enquadramento e a proporção: tela de celular em vertical, painel de computador em horizontal, ícones em quadrado. A interface preenche o quadro, sem margem enorme em volta.
- Cada slide pode ter um clima próprio: eles NÃO precisam formar uma série visual.
- Logo de app famoso é permitido e desejável quando o slide fala dele. Proibido inventar logotipo da ResponDM ou de marca que não existe, e proibida marca d'água.
- Sem pessoas famosas. Evite foto de gente genérica: só inclua pessoa se a ação dela for o assunto do slide.

PROIBIDO PEDIR (produz clip-art de banco de imagem): "3D bar chart", "infographic", "data visualization", "business concept", "social media concept", gráfico de barras flutuando sem contexto, ícone de nuvem, aperto de mão, engrenagem, lâmpada.

REGRA QUE MANDA EM TODAS: a imagem mostra o ASSUNTO do slide, na tela onde aquilo acontece de verdade. Se o slide fala de uma função nova, a imagem é aquela função na interface, nunca uma cena decorativa.

ESTRUTURA GERAL: slide 1 é a capa (hook de payoff). Slide 2 é CONFRONTO: derruba de frente o jeito que o leitor faz hoje e abre o loop. Desenvolvimento em escalada de CUSTO e CAUSA, do menor pro maior estrago. PROVA antes do fim. VIRADA com o que fazer no lugar. Resumo salvável quando houver 5 ou mais slides internos. Último slide é o fechamento com loop-back, no tipo que o conteúdo pede.

CHECAGEM FINAL, obrigatória antes de devolver. Passe slide por slide:
1. O leitor consegue ler esse slide sem se sentir citado? Então está fraco. Reescreva.
2. Dá pra adivinhar o texto de apoio só lendo o título? Então o slide não existe. Reescreva.
3. Tem "eu", "a gente" ou terceira pessoa institucional? Troque por "você".
4. O texto de apoio tem menos de 30 palavras? Está raso. Falta a batida do custo ou do porquê.
5. Dois slides seguidos dizem a mesma coisa com outras palavras? Corte um e aprofunde o outro.
6. Leu tudo em voz alta? Alguma frase termina em palavra abstrata ou tem palavra de reunião? Reescreve.`;

/* ─────────────────────────────────────────────
   Chamada à IA via Worker
   ───────────────────────────────────────────── */
async function chamarIA({system,userText,useWebFetch,schema,maxTokens}){
  const body={
    system,
    messages:[{role:"user",content:userText}],
    thinking:{type:"adaptive"},
    max_tokens:maxTokens||16000,
    output_config:{format:{type:"json_schema",schema}},
  };
  if(useWebFetch) body.tools=[{type:"web_fetch_20260209",name:"web_fetch",max_uses:3}];
  const r=await fetch(WORKER_URL+"/roteiro",{
    method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body),
  });
  let data;
  try{data=await r.json();}catch(e){throw new Error("Resposta inválida do servidor ("+r.status+")");}
  if(!r.ok) throw new Error(data?.error?.message||data?.error||("Erro "+r.status));
  if(data.stop_reason==="refusal") throw new Error("A IA recusou gerar esse conteúdo. Tente reformular o tema.");
  const textos=(data.content||[]).filter(b=>b.type==="text"&&b.text);
  if(!textos.length) throw new Error("A IA não retornou texto. Tente de novo.");
  return JSON.parse(textos[textos.length-1].text);
}

function contextoDoProjeto(p){
  const internos=p.qtdSlides-2;
  let s=`CATEGORIA ESCOLHIDA: ${CATEGORIAS.find(c=>c.id===p.categoria)?.nome||p.categoria}`;
  if(p.tema) s+=`\nTEMA DO CARROSSEL: ${p.tema}`;
  if(p.link) s+=`\nLINK DE MATÉRIA (leia a página com web_fetch e use como base factual do conteúdo): ${p.link}`;
  if(p.textoPronto) s+=`\n\nTEXTO BASE (MANDA no conteúdo dos slides; as regras do sistema mandam só na FORMA). Cada slide interno precisa ser rastreável a um trecho deste material: use os números, os exemplos e os fatos daqui em vez de inventar equivalentes. Se for um briefing, siga os ângulos e os dados que ele traz.\n"""\n${p.textoPronto}\n"""`;
  s+=`\nTOTAL DE SLIDES: ${p.qtdSlides} (slide 1 = capa, ${internos} slides internos, último slide = CTA)`;
  return s;
}

// Blocos <-> textarea: uma linha por bloco, no formato "RÓTULO: texto".

// Se um dia precisar de rótulo longo, vira um campo separado por bloco.
function AvisoDestaque({titulo,destaque}){
  const d=String(destaque||"").trim();
  if(!d||marcarDestaque(String(titulo||"").toUpperCase(),d.toUpperCase()).some(Boolean)) return null;
  return <div style={{fontSize:11,color:"#E53935",marginTop:5,fontWeight:600}}>Esse trecho não está no título, então nada vai ser pintado.</div>;
}
function blocosParaTexto(bs){return (bs||[]).map(b=>(b.rotulo?b.rotulo+": ":"")+(b.texto||"")).join("\n");}
function textoParaBlocos(t){
  return String(t||"").split("\n").map(l=>{
    const i=l.indexOf(":");
    return (i>0&&i<=18)?{rotulo:l.slice(0,i).trim(),texto:l.slice(i+1).replace(/^ /,"")}:{rotulo:"",texto:l};
  });
}

function PreviewCategoria({cat,onConfirm,onClose}){
  const [imgs,setImgs]=useState([]);
  useEffect(()=>{
    let vivo=true;
    (async()=>{
      try{
        await Promise.all(["400 90px 'Anton'","800 30px Inter","600 28px Inter","500 38px Inter","400 38px Inter"]
          .map(f=>document.fonts.load(f)));
      }catch(e){}
      const am=AMOSTRAS[cat.id];if(!am)return;
      const specs=[
        {tipo:"capa",headline:am.capa.h,sub:am.capa.s,destaque:am.capa.d},
        {tipo:"interno",etiqueta:am.meio.e,titulo:am.meio.t,texto:am.meio.x,destaque:"",layout:am.meio.l||"texto",blocos:am.meio.b||[]},
        {tipo:"cta",titulo:am.cta.t,texto:am.cta.x,keyword:am.cta.k,destaque:""},
      ];
      const posicoes=[0,2,6];
      const urls=specs.map((sp,i)=>{
        const cv=document.createElement("canvas");cv.width=W;cv.height=H;
        desenharSlide(cv.getContext("2d"),sp,{idx:posicoes[i],total:7,accent:cat.accent,chip:cat.chip,estilo:ESTILO_PADRAO});
        return cv.toDataURL("image/png");
      });
      if(vivo)setImgs(urls);
    })();
    return()=>{vivo=false;};
  },[cat.id]);
  return(
    <div onClick={onClose} style={{position:"fixed",inset:0,background:"rgba(26,22,48,.55)",zIndex:50,display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
      <div onClick={e=>e.stopPropagation()} style={{background:"var(--surface)",borderRadius:20,padding:24,width:"100%",maxWidth:720,maxHeight:"90vh",overflowY:"auto",boxShadow:"var(--shadow-md)"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}>
          <div style={{fontWeight:800,fontSize:17}}>{cat.emoji} {cat.nome}</div>
          <button onClick={onClose} style={{border:"none",background:"none",cursor:"pointer",fontSize:18,color:"var(--text3)",fontWeight:800}}>✕</button>
        </div>
        <p style={{color:"var(--text2)",fontSize:13,marginBottom:16}}>{cat.desc} Assim ficam a capa, um slide do meio e o CTA:</p>
        {imgs.length===0?(
          <div style={{padding:40,textAlign:"center",color:"var(--text3)"}}>Desenhando o preview...</div>
        ):(
          <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:10,marginBottom:18}}>
            {imgs.map((u,i)=><img key={i} src={u} style={{width:"100%",borderRadius:10,border:"1px solid var(--border)",display:"block"}}/>)}
          </div>
        )}
        <div style={{display:"flex",justifyContent:"flex-end",gap:10}}>
          <Btn variant="secondary" onClick={onClose}>Voltar</Btn>
          <Btn onClick={onConfirm}>Confirmar template →</Btn>
        </div>
      </div>
    </div>
  );
}

/* ─────────────────────────────────────────────
   Etapa 2 — Tema

  const cat=CATEGORIAS.find(c=>c.id===projeto.categoria);
  return(
    <div>
      <h2 style={{fontSize:22,fontWeight:800,marginBottom:6}}>Sobre o que é o carrossel?</h2>

        Preencha pelo menos um dos campos abaixo.
      </p>
      <Card style={{marginBottom:20}}>
        <Field label="Tema do carrossel">
          <textarea rows={3} style={{...inputStyle,resize:"vertical"}} value={projeto.tema}
            placeholder="Ex.: O Instagram mudou o alcance de contas pequenas em 2026. O que muda e como aproveitar."
            onChange={e=>update({tema:e.target.value})}/>
        </Field>
        <Field label="Link de matéria (opcional, a IA lê a página e usa como base)">
          <input type="url" style={inputStyle} value={projeto.link}
            placeholder="https://exemplo.com/materia"
            onChange={e=>update({link:e.target.value})}/>
        </Field>
        <Field label="Texto pronto (opcional, a IA só adapta pro formato de slides, sem inventar)">
          <textarea rows={5} style={{...inputStyle,resize:"vertical"}} value={projeto.textoPronto}
            placeholder="Cole aqui um briefing, roteiro de vídeo ou texto que você já tem..."
            onChange={e=>update({textoPronto:e.target.value})}/>
        </Field>
        <Field label="Quantidade de slides (contando capa e CTA)">
          <div style={{display:"flex",alignItems:"center",gap:14}}>
            <Btn variant="secondary" style={{padding:"8px 16px"}} onClick={()=>update({qtdSlides:Math.max(4,projeto.qtdSlides-1)})}>−</Btn>
            <div style={{fontSize:22,fontWeight:800,minWidth:32,textAlign:"center"}}>{projeto.qtdSlides}</div>
            <Btn variant="secondary" style={{padding:"8px 16px"}} onClick={()=>update({qtdSlides:Math.min(10,projeto.qtdSlides+1)})}>+</Btn>
            <span style={{fontSize:12,color:"var(--text3)"}}>de 4 a 10 · padrão 8</span>

      </div>
    </div>
  );
}

/* ─────────────────────────────────────────────
   Etapa 3 — Roteiro (capas → roteiro → edição)
   ───────────────────────────────────────────── */
function StepRoteiro({projeto,update,next,back}){
  const [busy,setBusy]=useState("");   // "" | "capas" | "roteiro"
  const [err,setErr]=useState("");

  async function gerarCapas(){
    setBusy("capas");setErr("");
    try{
      const out=await chamarIA({
        system:PROMPT_BASE+"\n\n"+PROMPT_CATEGORIA[projeto.categoria],
        userText:contextoDoProjeto(projeto)+`\n\nTAREFA: gere exatamente 3 opções de CAPA para este carrossel, cada uma com um gatilho psicológico DIFERENTE (escolha 3 entre: curiosidade, FOMO/erro, ganho concreto, defesa, alívio, descrença/contrário). Cada headline anuncia o PAYOFF, nunca o assunto, em 6 a 12 palavras, e precisa passar no teste do DM: alguém mandaria essa capa pra um amigo específico. Subtítulo: 1 frase que neutraliza a objeção principal ou aumenta a tensão.`,
        useWebFetch:!!projeto.link.trim(),
        schema:SCHEMA_CAPAS,
        maxTokens:8000,
      });
      update({capas:out.capas||[],capaIdx:null,slides:[],cta:null});
    }catch(e){setErr(String(e.message||e));}
    setBusy("");
  }

  async function gerarRoteiro(){
    const capa=projeto.capas[projeto.capaIdx];
    if(!capa) return;
    setBusy("roteiro");setErr("");
    try{
      const internos=projeto.qtdSlides-2;
      const out=await chamarIA({
        system:PROMPT_BASE+"\n\n"+PROMPT_CATEGORIA[projeto.categoria],
        userText:contextoDoProjeto(projeto)
          +`

CAPA JÁ ESCOLHIDA (slide 1, não recrie):
Headline: ${capa.headline}
Subtítulo: ${capa.subtitulo}

TAREFA: escreva os ${internos} slides internos (slide 2 até o slide ${projeto.qtdSlides-1}) alinhados a essa capa, e o slide final de CTA.

PRIMEIRO decida o PAPEL de cada um dos ${internos} slides e monte o arco inteiro, depois escreva: CONFRONTO no slide 2, CUSTO e CAUSA no meio em escalada do menor pro maior estrago, PROVA antes do fim, VIRADA com o que fazer no lugar${internos>=5?", e RESUMO salvável no último slide interno":""}. Dois slides seguidos nunca repetem o mesmo papel dizendo a mesma coisa com outras palavras.

Escreva TUDO em "você" e "seu perfil". Nada de "eu", nada de "a gente", nada de terceira pessoa institucional.
Texto de apoio: 30 a 45 palavras em três batidas (o que está acontecendo, por que acontece, o que isso custa ou o que fazer).
${projeto.textoPronto.trim()?"O TEXTO BASE acima MANDA no conteúdo: cada slide interno tem que ser rastreável a um trecho dele. Use os números, os exemplos e os fatos que estão lá em vez de inventar equivalentes. As regras do sistema mandam só na forma.":""}
Antes de devolver, passe slide por slide nos dois testes: o leitor consegue ler isso sem se sentir citado? Então está fraco, reescreva. Dá pra adivinhar o texto de apoio só lendo o título? Então o slide não existe, reescreva.

Devolva no campo "slides" exatamente ${internos} itens, na ordem.`,
        useWebFetch:!!projeto.link.trim(),
        schema:SCHEMA_ROTEIRO,
        maxTokens:16000,
      });
      update({slides:out.slides||[],cta:out.cta||null});
    }catch(e){setErr(String(e.message||e));}
    setBusy("");
  }

  async function gerarCta(tipo){
    const capa=projeto.capas[projeto.capaIdx];
    if(!capa) return;
    setBusy("cta");setErr("");
    try{
      const roteiro=projeto.slides.map((s,i)=>"SLIDE "+(i+2)+": ["+(s.etiqueta||"")+"] "+s.titulo+" | "
        +(s.texto||(s.blocos||[]).map(b=>(b.rotulo?b.rotulo+": ":"")+b.texto).join(" / "))).join(`
`);
      const out=await chamarIA({
        system:PROMPT_BASE+`

`+PROMPT_CATEGORIA[projeto.categoria],
        userText:contextoDoProjeto(projeto)
          +`

CAPA: ${capa.headline} | ${capa.subtitulo}

SLIDES JÁ ESCRITOS (não recrie nenhum deles):
${roteiro}

TAREFA: escreva SÓ o slide final de fechamento, obrigatoriamente do tipo "${tipo}". Ele fecha o círculo com a promessa da capa e obedece às regras desse tipo de fechamento. `
          +(tipo==="comentar"?"Escolha a palavra-chave e devolva em palavra_chave.":"Devolva palavra_chave como string vazia."),
        schema:SCHEMA_CTA,
        maxTokens:4000,
      });
      update({cta:out.cta});
    }catch(e){setErr(String(e.message||e));}
    setBusy("");
  }

  function setSlide(i,campo,valor){
    const slides=projeto.slides.map((s,j)=>j===i?{...s,[campo]:valor}:s);
    update({slides});
  }
  function setCapa(campo,valor){
    const capas=projeto.capas.map((c,j)=>j===projeto.capaIdx?{...c,[campo]:valor}:c);
    update({capas});
  }

  const capaEscolhida=projeto.capaIdx!=null?projeto.capas[projeto.capaIdx]:null;
  const temRoteiro=projeto.slides.length>0&&projeto.cta;

  return(
    <div>
      <h2 style={{fontSize:22,fontWeight:800,marginBottom:6}}>Roteiro</h2>
      <p style={{color:"var(--text2)",marginBottom:22}}>Primeiro a IA sugere 3 capas. Você escolhe uma, ela escreve o roteiro completo, e você edita o que quiser.</p>
      <ErrBox msg={err} onClose={()=>setErr("")}/>

      {/* ── Bloco 1: capas ── */}
      {projeto.capas.length===0?(
        <Card style={{textAlign:"center",padding:36,marginBottom:20}}>
          <Btn onClick={gerarCapas} disabled={!!busy}>
            {busy==="capas"?<span><span className="spinner"/>Gerando capas...</span>:"✨ Gerar 3 opções de capa"}
          </Btn>
          <div style={{fontSize:12,color:"var(--text3)",marginTop:12}}>Usa a IA (Claude). Leva alguns segundos.</div>
        </Card>
      ):(
        <div style={{marginBottom:24}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
            <div style={{fontWeight:800,fontSize:15}}>1. Escolha a capa</div>
            <Btn variant="ghost" onClick={gerarCapas} disabled={!!busy}>{busy==="capas"?"Gerando...":"↻ Gerar outras 3"}</Btn>
          </div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(240px,1fr))",gap:12}}>
            {projeto.capas.map((c,i)=>(
              <Card key={i} selected={projeto.capaIdx===i} onClick={()=>update({capaIdx:i})}>
                <div style={{fontSize:11,fontWeight:700,color:projeto.capaIdx===i?"var(--purple)":"var(--text3)",marginBottom:8}}>OPÇÃO {i+1}{projeto.capaIdx===i?" · ESCOLHIDA":""}</div>
                <div style={{fontWeight:800,fontSize:15,lineHeight:1.3,marginBottom:6}}>{c.headline}</div>
                <div style={{fontSize:13,color:"var(--text2)"}}>{c.subtitulo}</div>
              </Card>
            ))}
          </div>
        </div>
      )}

      {/* ── Bloco 2: gerar roteiro ── */}
      {capaEscolhida&&!temRoteiro&&(
        <Card style={{textAlign:"center",padding:36,marginBottom:20}}>
          <Btn onClick={gerarRoteiro} disabled={!!busy}>
            {busy==="roteiro"?<span><span className="spinner"/>Escrevendo o roteiro...</span>:`✍️ Gerar roteiro completo (${projeto.qtdSlides} slides)`}
          </Btn>
        </Card>
      )}

      {/* ── Bloco 3: edição ── */}
      {temRoteiro&&(
        <div style={{marginBottom:24}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
            <div style={{fontWeight:800,fontSize:15}}>2. Revise e edite o roteiro</div>
            <Btn variant="ghost" onClick={gerarRoteiro} disabled={!!busy}>{busy==="roteiro"?"Gerando...":"↻ Regenerar roteiro"}</Btn>
          </div>

          <Card style={{marginBottom:12,borderLeft:"5px solid var(--purple)"}}>
            <div style={{fontSize:11,fontWeight:800,color:"var(--purple)",marginBottom:10}}>SLIDE 1 · CAPA</div>
            <Field label="Headline">
              <textarea rows={2} style={{...inputStyle,fontWeight:700,resize:"vertical"}} value={capaEscolhida.headline} onChange={e=>setCapa("headline",e.target.value)}/>
            </Field>
            <Field label="Subtítulo">
              <input style={inputStyle} value={capaEscolhida.subtitulo} onChange={e=>setCapa("subtitulo",e.target.value)}/>
            </Field>
            <Field label="Destaque (trecho da headline que ganha cor, opcional)">
              <input style={{...inputStyle,maxWidth:320}} value={capaEscolhida.destaque||""} placeholder="Ex.: 7 minutos" onChange={e=>setCapa("destaque",e.target.value)}/>
              <AvisoDestaque titulo={capaEscolhida.headline} destaque={capaEscolhida.destaque}/>
            </Field>
          </Card>

          {projeto.slides.map((s,i)=>(
            <Card key={i} style={{marginBottom:12}}>
              <div style={{fontSize:11,fontWeight:800,color:"var(--text3)",marginBottom:10}}>
                SLIDE {i+2}
                {s.papel?<span style={{marginLeft:8,padding:"2px 8px",borderRadius:999,background:"var(--surface2,#F2EEFF)",color:"var(--purple)"}}>{String(s.papel).toUpperCase()}</span>:null}
              </div>
              <div style={{display:"flex",gap:12,flexWrap:"wrap"}}>
                <div style={{width:150}}>
                  <Field label="Etiqueta">
                    <input style={inputStyle} value={s.etiqueta} onChange={e=>setSlide(i,"etiqueta",e.target.value)}/>
                  </Field>
                </div>
                <div style={{flex:1,minWidth:220}}>
                  <Field label="Título">
                    <textarea rows={2} style={{...inputStyle,fontWeight:700,resize:"vertical"}} value={s.titulo} onChange={e=>setSlide(i,"titulo",e.target.value)}/>
                  </Field>
                </div>
              </div>
              <div style={{display:"flex",gap:12,flexWrap:"wrap"}}>
                <div style={{width:190}}>
                  <Field label="Layout do slide">
                    <select style={inputStyle} value={s.layout||"texto"} onChange={e=>setSlide(i,"layout",e.target.value)}>
                      <option value="texto">Texto corrido</option>
                      <option value="checklist">Checklist</option>
                      <option value="mito_verdade">Mito e verdade</option>
                      <option value="antes_depois">Antes e depois</option>
                    </select>
                  </Field>
                </div>
                <div style={{width:200}}>
                  <Field label="Destaque (opcional)">
                    <input style={inputStyle} value={s.destaque||""} placeholder="trecho do título" onChange={e=>setSlide(i,"destaque",e.target.value)}/>

                  </Field>
                </div>
              </div>
              {(s.layout||"texto")==="texto"?(
                <Field label="Texto de apoio (30 a 45 palavras)">

                </Field>
              ):(

                    placeholder={s.layout==="checklist"?"Palavra-chave escrita na capa\nPrimeira linha da legenda com o termo de busca":"MITO: postar todo dia faz o perfil crescer\nVERDADE: o que sobe a conta é quanto tempo a pessoa fica"}
                    value={blocosParaTexto(s.blocos)}
                    onChange={e=>setSlide(i,"blocos",textoParaBlocos(e.target.value))}/>
                </Field>
              )}
            </Card>
          ))}

          <Card style={{borderLeft:"5px solid var(--yellow)"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
              <div style={{fontSize:11,fontWeight:800,color:"var(--text2)"}}>SLIDE {projeto.qtdSlides} · FECHAMENTO</div>
              <Btn variant="ghost" onClick={()=>gerarCta(projeto.cta.tipo||"comentar")} disabled={!!busy}>
                {busy==="cta"?"Reescrevendo...":"↻ Reescrever fechamento"}
              </Btn>
            </div>
            <Field label="Tipo de fechamento (trocar aqui reescreve só este slide)">
              <select style={{...inputStyle,maxWidth:340}} value={projeto.cta.tipo||"comentar"}
                onChange={e=>{update({cta:{...projeto.cta,tipo:e.target.value}});gerarCta(e.target.value);}}>
                {Object.keys(FECHAMENTOS).map(k=><option key={k} value={k}>{FECHAMENTOS[k].nome}</option>)}
              </select>
            </Field>
            <Field label="Título">
              <textarea rows={2} style={{...inputStyle,fontWeight:700,resize:"vertical"}} value={projeto.cta.titulo} onChange={e=>update({cta:{...projeto.cta,titulo:e.target.value}})}/>
            </Field>
            <Field label="Texto">
              <textarea rows={2} style={{...inputStyle,resize:"vertical"}} value={projeto.cta.texto} onChange={e=>update({cta:{...projeto.cta,texto:e.target.value}})}/>
            </Field>
            <div style={{display:"flex",gap:12,flexWrap:"wrap"}}>
              {(projeto.cta.tipo||"comentar")==="comentar"&&(
                <Field label="Palavra-chave do comentário (vira o gatilho da automação na ResponDM)">
                  <input style={{...inputStyle,fontWeight:800,textTransform:"uppercase",width:240}} value={projeto.cta.palavra_chave} onChange={e=>update({cta:{...projeto.cta,palavra_chave:e.target.value.toUpperCase()}})}/>
                </Field>
              )}
              <Field label="Destaque (opcional)">
                <input style={{...inputStyle,width:200}} value={projeto.cta.destaque||""} placeholder="trecho do título" onChange={e=>update({cta:{...projeto.cta,destaque:e.target.value}})}/>
                <AvisoDestaque titulo={projeto.cta.titulo} destaque={projeto.cta.destaque}/>
              </Field>
            </div>
          </Card>
        </div>
      )}

      <div style={{display:"flex",justifyContent:"space-between"}}>
        <Btn variant="secondary" onClick={back}>← Voltar</Btn>
        <Btn onClick={next} disabled={!temRoteiro}>Avançar para os Slides →</Btn>
      </div>
    </div>
  );
}

/* ─────────────────────────────────────────────
   Etapa 4 — Slides: motor visual em Canvas (1080×1350)
   Capa e CTA escuros (balões de DM), internos claros.
   ───────────────────────────────────────────── */
/* ══ ENGINE-START (o harness de teste extrai deste marcador até o de fechamento) ══ */
const W=1080,H=1350,DARK="#1A1A2E",ROXO="#7447E1",AMARELO="#FEDB00",LAVANDA="#C4B0F5";

// Tamanhos P/M/G/GG (multiplicadores sobre o tamanho base de cada componente)
const TAM={P:.85,M:1,G:1.15,GG:1.3};
// Fontes de título disponíveis. peso: único peso carregado; escala: compensa a largura
// (condensadas como Anton rendem mais estreitas, então sobem de corpo); lh: line-height.
const FONTES={
  "Anton":{peso:"400",escala:1.12,lh:1.06},
  "Bebas Neue":{peso:"400",escala:1.18,lh:1.02},
  "Inter":{peso:"900",escala:1,lh:1.14},
  "Poppins":{peso:"800",escala:.97,lh:1.16},
  "Montserrat":{peso:"800",escala:.95,lh:1.16},
};
// Tipos de fechamento do último slide. pill null = usa a palavra-chave; linha vazia = slide sem pedido.
const FECHAMENTOS={
  comentar:{nome:"Comentar a palavra-chave",linha:"COMENTA AÍ EMBAIXO 👇",pill:null},
  salvar:{nome:"Salvar o post",linha:"SALVA PRA NÃO ESQUECER",pill:"🔖 SALVAR"},
  mandar:{nome:"Mandar pra alguém",linha:"MANDA PRA QUEM PRECISA VER",pill:"➤ ENVIAR"},
  sem_pedido:{nome:"Sem pedido, só fecha",linha:"",pill:""},
};
const ESTILO_PADRAO={fonteTitulo:"Anton",tamanhos:{},cores:{}};

function resolverEstilo(projeto,key){
  const g=projeto.estilo||{},o=(projeto.ajustes||{})[key]||{};
  return{
    fonteTitulo:o.fonteTitulo||g.fonteTitulo||"Anton",
    tamanhos:{...(g.tamanhos||{}),...(o.tamanhos||{})},
    cores:{...(g.cores||{}),...(o.cores||{})},
  };
}
function mult(est,comp){return TAM[(est.tamanhos||{})[comp]]||1;}
function corClara(hex){
  const m=/^#?([0-9a-f]{6})$/i.exec(String(hex||""));if(!m)return false;
  const n=parseInt(m[1],16),r=n>>16,g=(n>>8)&255,b=n&255;
  return (r*299+g*587+b*114)/1000>150;
}

// Marca quais palavras do título pertencem ao trecho de destaque (comparação sem pontuação)
function marcarDestaque(txt,destaque){
  const norm=w=>String(w).toLowerCase().replace(/[^\p{L}\p{N}%]/gu,"");
  const words=String(txt||"").trim().split(/\s+/);
  const D=String(destaque||"").trim().split(/\s+/).map(norm).filter(Boolean);
  const marks=words.map(()=>false);
  if(D.length){
    for(let i=0;i<=words.length-D.length;i++){
      let ok=true;
      for(let j=0;j<D.length;j++) if(norm(words[i+j])!==D[j]){ok=false;break;}
      if(ok){for(let j=0;j<D.length;j++)marks[i+j]=true;break;}
    }
  }
  return marks;
}

function rr(ctx,x,y,w,h,r){
  r=Math.min(r,h/2,w/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
function quebrar(ctx,txt,maxW){
  const words=String(txt||"").trim().split(/\s+/);const lines=[];let cur="";
  for(const w of words){const t=cur?cur+" "+w:w;
    if(ctx.measureText(t).width>maxW&&cur){lines.push(cur);cur=w;}else cur=t;}
  if(cur)lines.push(cur);
  return lines;
}
// Ajusta o corpo do TÍTULO na fonte escolhida até caber em maxLines. base/min em px "Inter";
// a escala da fonte compensa condensadas. Retorna o px final, as linhas e o line-height.
function ajustarFonteTit(ctx,est,txt,maxW,base,min,maxLines){
  const f=FONTES[est.fonteTitulo]||FONTES.Anton;
  const font=s=>f.peso+" "+s+"px '"+est.fonteTitulo+"'";
  let px=Math.round(base*f.escala);const minPx=Math.round(min*f.escala);
  while(px>minPx){ctx.font=font(px);if(quebrar(ctx,txt,maxW).length<=maxLines)break;px-=4;}
  ctx.font=font(px);
  return {px,lines:quebrar(ctx,txt,maxW),lh:f.lh,font:font(px)};
}
function desenharLinhas(ctx,lines,x,y,lineH,align){
  ctx.textAlign=align||"left";
  lines.forEach((l,i)=>ctx.fillText(l,x,y+i*lineH));
  ctx.textAlign="left";
  return y+lines.length*lineH;
}
// Desenha o título palavra a palavra, pintando as palavras marcadas na cor de destaque.
// marks segue a ordem das palavras do texto que gerou as linhas (mesma quebra).
function desenharLinhasT(ctx,lines,marks,x,y,lineH,align,corBase,corDestaque){
  ctx.textAlign="left";
  const sp=ctx.measureText(" ").width;
  let wi=0;
  lines.forEach((linha,li)=>{
    const words=linha.split(" ");
    let cx=align==="center"?x-ctx.measureText(linha).width/2:x;
    const ly=y+li*lineH;
    for(const wd of words){
      ctx.fillStyle=marks[wi]?corDestaque:corBase;
      ctx.fillText(wd,cx,ly);
      cx+=ctx.measureText(wd).width+sp;
      wi++;
    }
  });
  ctx.fillStyle=corBase;
  return y+lines.length*lineH;
}
function pill(ctx,cx,y,texto,bg,fg,size,center){
  ctx.font="800 "+size+"px Inter";
  const tw=ctx.measureText(texto).width,padX=size*1.2,h=size*2.2;
  const w=tw+padX*2,x=center?cx-w/2:cx;
  ctx.fillStyle=bg;rr(ctx,x,y,w,h,h/2);ctx.fill();
  ctx.fillStyle=fg;ctx.textBaseline="middle";ctx.textAlign="center";
  ctx.fillText(texto,x+w/2,y+h/2+size*0.06);
  ctx.textBaseline="alphabetic";ctx.textAlign="left";
  return {x,w,h};
}
function balaoDigitando(ctx,cx,y,center){
  const w=190,h=84,x=center?cx-w/2:cx;
  ctx.fillStyle=ROXO;rr(ctx,x,y,w,h,42);ctx.fill();
  ctx.beginPath();ctx.moveTo(x+18,y+h-4);ctx.lineTo(x-6,y+h+22);ctx.lineTo(x+52,y+h-4);ctx.closePath();ctx.fill();
  ctx.fillStyle="rgba(255,255,255,.95)";
  for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(x+w/2+(i-1)*34,y+h/2,9,0,7);ctx.fill();}
}
function fundoFoto(ctx,img,forte){
  const s=Math.max(W/img.width,H/img.height);
  const dw=img.width*s,dh=img.height*s;
  ctx.drawImage(img,(W-dw)/2,(H-dh)/2,dw,dh);
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,"rgba(26,26,46,"+(forte?.55:.45)+")");
  g.addColorStop(.55,"rgba(26,26,46,"+(forte?.8:.7)+")");
  g.addColorStop(1,"rgba(26,26,46,.95)");
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  // Vinheta: escurece as bordas pra foto nunca ficar "seca" atrás do texto
  const v=ctx.createRadialGradient(W/2,H*.44,H*.3,W/2,H/2,H*.85);
  v.addColorStop(0,"rgba(26,26,46,0)");
  v.addColorStop(1,"rgba(26,26,46,.5)");
  ctx.fillStyle=v;ctx.fillRect(0,0,W,H);
}
// Frame de print no estilo do card do canal do WhatsApp (HTML UTEIS/CANAL WHATSAPP):
// fundo quase preto, borda roxa fina e cantos arredondados. No modo "recortado" ele arredonda
// só em cima e fica sem borda embaixo, porque vaza pro rodapé do slide em vez de flutuar.
function caminhoFrame(ctx,x,y,w,h,r,inteiro){
  ctx.beginPath();
  ctx.moveTo(x,y+h);
  ctx.lineTo(x,y+r);
  ctx.arcTo(x,y,x+r,y,r);
  ctx.lineTo(x+w-r,y);
  ctx.arcTo(x+w,y,x+w,y+r,r);
  if(inteiro){
    ctx.lineTo(x+w,y+h-r);
    ctx.arcTo(x+w,y+h,x+w-r,y+h,r);
    ctx.lineTo(x+r,y+h);
    ctx.arcTo(x,y+h,x,y+h-r,r);
  }else{
    ctx.lineTo(x+w,y+h);
  }
}
function frameFoto(ctx,img,x,y,w,h,inteiro){
  const R=26;
  ctx.save();
  ctx.shadowColor="rgba(8,4,24,.5)";ctx.shadowBlur=44;ctx.shadowOffsetY=16;
  ctx.fillStyle="#0A0118";
  caminhoFrame(ctx,x,y,w,h,R,inteiro);ctx.closePath();ctx.fill();
  ctx.restore();

  ctx.save();
  caminhoFrame(ctx,x,y,w,h,R,inteiro);ctx.closePath();ctx.clip();
  // recortado preenche o frame (cover); inteiro mostra a imagem toda, sem cortar nada (contain)
  const s=inteiro?Math.min(w/img.width,h/img.height):Math.max(w/img.width,h/img.height);
  const dw=img.width*s,dh=img.height*s;
  ctx.drawImage(img,x+(w-dw)/2,y+(h-dh)/2,dw,dh);
  ctx.restore();

  ctx.strokeStyle="rgba(139,92,246,.45)";ctx.lineWidth=3;
  caminhoFrame(ctx,x+1.5,y+1.5,w-3,h-(inteiro?3:0),R,inteiro);
  if(inteiro)ctx.closePath();
  ctx.stroke();  // sem closePath no recortado = sem linha embaixo
}
// Espaço mínimo que o print sempre recebe, pra ele nunca sumir calado como acontecia no card 4:3
const FRAME_MIN=330;
function frameAuto(ctx,img,yTop,inteiro,minH){
  const yFim=H-108,min=minH||FRAME_MIN;
  let x=96,w=W-2*96,h=yFim-yTop;
  if(h<min){h=min;yTop=yFim-h;}
  if(inteiro){
    // o frame assume a proporção da imagem, então nada é cortado e não sobra tarja preta:
    // print largo usa a largura toda, print vertical estreita o frame e centraliza
    const prop=img.height/img.width;
    if(w*prop<=h) h=Math.round(w*prop);
    else{w=Math.round(h/prop);x=Math.round((W-w)/2);}
  }
  frameFoto(ctx,img,x,yTop,w,h,inteiro);
}
function gridEscuro(ctx){
  ctx.strokeStyle="rgba(196,176,245,0.06)";ctx.lineWidth=1;
  for(let x=0;x<=W;x+=44){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
  for(let y=0;y<=H;y+=44){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
}
function pontosClaros(ctx){
  ctx.fillStyle="rgba(116,71,225,0.10)";
  for(let x=44;x<W;x+=44)for(let y=44;y<H;y+=44){ctx.beginPath();ctx.arc(x,y,2,0,7);ctx.fill();}
}
function corEtiqueta(et,accent){
  const up=String(et||"").toUpperCase();
  if(["MITO","ERRO","ANTES","CUSTO"].some(k=>up.startsWith(k))) return {bg:"#E53935",fg:"#fff"};
  if(["APLIQUE","CONTEXTO","RESUMO"].some(k=>up.startsWith(k))) return {bg:DARK,fg:"#fff"};
  if(["DICA","PERGUNTA","CRENÇA"].some(k=>up.startsWith(k))) return {bg:LAVANDA,fg:DARK};
  return {bg:accent.bg,fg:accent.fg};
}
function metaBar(ctx,idx,total,accent,dark,semSeta){
  ctx.font="600 28px Inter";
  ctx.fillStyle=dark?"rgba(255,255,255,.6)":"#A49EC4";
  ctx.fillText(String(idx+1).padStart(2,"0")+"/"+String(total).padStart(2,"0"),80,H-58);
  // Fileira de pontos (ref do Studio): quadradinhos, ativo vira losango na cor de acento
  const gap=36,y=H-68,x0=W/2-(total-1)*gap/2;
  for(let i=0;i<total;i++){
    const x=x0+i*gap;
    if(i===idx){
      ctx.fillStyle=accent.bg;
      ctx.save();ctx.translate(x,y);ctx.rotate(Math.PI/4);ctx.fillRect(-8.5,-8.5,17,17);ctx.restore();
    }else{
      ctx.fillStyle=dark?"rgba(255,255,255,.3)":"rgba(26,22,48,.22)";
      ctx.fillRect(x-5,y-5,10,10);
    }
  }
  if(!semSeta){
    ctx.font="800 30px Inter";ctx.fillStyle=dark?AMARELO:ROXO;ctx.textAlign="right";
    ctx.fillText(idx===0?"ARRASTA →":"→",W-80,H-58);ctx.textAlign="left";
  }
}
function topo(ctx,chip,accent,dark){
  ctx.font="600 28px Inter";
  ctx.fillStyle=dark?"rgba(255,255,255,.65)":"#A49EC4";
  ctx.fillText("@respon_dm",80,106);
  if(!chip)return; // chip da categoria só na capa: repetido nos 8 slides ele não informa nada
  ctx.font="800 24px Inter";
  const tw=ctx.measureText(chip).width,padX=28,h=52,w=tw+padX*2,x=W-80-w;
  ctx.fillStyle=accent.bg;rr(ctx,x,72,w,h,26);ctx.fill();
  ctx.fillStyle=accent.fg;ctx.textBaseline="middle";ctx.textAlign="center";
  ctx.fillText(chip,x+w/2,72+h/2+1);
  ctx.textBaseline="alphabetic";ctx.textAlign="left";
}

function alphaHex(c,aa){return /^#[0-9a-fA-F]{6}$/.test(c)?c+aa:c;}

// Corpo dos slides internos quando o layout não é texto corrido.
// draw=false só mede. Medir e desenhar pelo MESMO caminho, senão as duas contas divergem.
function blocosBody(ctx,draw,layout,blocos,x,y,larg,corpo,accent,corTexto,claro){
  const lineH=Math.round(corpo*1.5),rotPx=26;
  const cinza=claro?"rgba(26,22,48,.06)":"rgba(255,255,255,.07)";
  const borda=claro?"rgba(26,22,48,.14)":"rgba(255,255,255,.18)";

  if(layout==="antes_depois"){
    const gap=74,cw=Math.round((larg-gap)/2),vpx=Math.round(corpo*1.35),vlh=Math.round(vpx*1.2);
    const cols=blocos.slice(0,2).map(b=>{
      ctx.font="800 "+vpx+"px Inter";
      return {rot:String(b.rotulo||"").toUpperCase(),ls:quebrar(ctx,b.texto,cw-56)};
    });
    const hTxt=cols.reduce((m,c)=>Math.max(m,c.ls.length*vlh),0);
    const boxH=34+rotPx+30+hTxt+34;
    if(draw){
      cols.forEach((c,i)=>{
        const bx=x+i*(cw+gap),forte=i===cols.length-1;
        ctx.fillStyle=forte?alphaHex(accent.bg,"1F"):cinza;
        rr(ctx,bx,y,cw,boxH,22);ctx.fill();
        ctx.strokeStyle=forte?accent.bg:borda;ctx.lineWidth=3;
        rr(ctx,bx+1.5,y+1.5,cw-3,boxH-3,21);ctx.stroke();
        ctx.font="800 "+rotPx+"px Inter";
        ctx.fillStyle=forte?accent.bg:(claro?"#8A83A8":"rgba(255,255,255,.55)");
        ctx.fillText(c.rot,bx+28,y+34+rotPx);
        ctx.font="800 "+vpx+"px Inter";ctx.fillStyle=corTexto;
        c.ls.forEach((l,j)=>ctx.fillText(l,bx+28,y+34+rotPx+30+vpx+j*vlh));
      });
      ctx.font="800 46px Inter";ctx.fillStyle=accent.bg;ctx.textAlign="center";
      ctx.fillText("→",x+cw+gap/2,y+boxH/2+16);ctx.textAlign="left";
    }
    return boxH;
  }

  if(layout==="mito_verdade"){
    let h=0;
    blocos.slice(0,2).forEach((b,i)=>{
      ctx.font="400 "+corpo+"px Inter";
      const ls=quebrar(ctx,b.texto,larg-70);
      const cor=i===0?"#E53935":accent.bg;
      const boxH=30+rotPx+26+ls.length*lineH+16;
      if(draw){
        const by=y+h;
        ctx.fillStyle=alphaHex(cor,"14");rr(ctx,x,by,larg,boxH,20);ctx.fill();
        ctx.fillStyle=cor;rr(ctx,x,by,10,boxH,5);ctx.fill();
        ctx.font="800 "+rotPx+"px Inter";ctx.fillStyle=cor;
        ctx.fillText(String(b.rotulo||"").toUpperCase(),x+36,by+30+rotPx);
        ctx.font="400 "+corpo+"px Inter";ctx.fillStyle=corTexto;
        ls.forEach((l,j)=>ctx.fillText(l,x+36,by+30+rotPx+26+corpo+j*lineH));
      }
      h+=boxH+22;
    });
    return h;
  }

  // checklist: caixinha marcada + item
  let h=0;
  blocos.forEach(b=>{
    ctx.font="400 "+corpo+"px Inter";
    const ls=quebrar(ctx,b.texto,larg-84);
    const itemH=Math.max(54,ls.length*lineH);
    if(draw){
      const by=y+h;
      ctx.strokeStyle=accent.bg;ctx.lineWidth=4;rr(ctx,x+2,by+2,44,44,12);ctx.stroke();
      ctx.lineWidth=6;ctx.lineCap="round";
      ctx.beginPath();ctx.moveTo(x+13,by+24);ctx.lineTo(x+21,by+33);ctx.lineTo(x+36,by+13);ctx.stroke();
      ctx.lineCap="butt";
      ctx.font="400 "+corpo+"px Inter";ctx.fillStyle=corTexto;
      ls.forEach((l,j)=>ctx.fillText(l,x+84,by+corpo+j*lineH));
    }
    h+=itemH+26;
  });
  return h;
}
function desenharSlide(ctx,sp,opts){
  const {idx,total,chip,foto,modo}=opts;
  const est=opts.estilo||ESTILO_PADRAO,cores=est.cores||{};
  let accent=opts.accent;
  if(cores.acento)accent={bg:cores.acento,fg:corClara(cores.acento)?DARK:"#FFFFFF"};
  const fotoFundo=(foto&&(!modo||modo==="fundo"))?foto:null;
  const fotoFixa=(foto&&(modo==="fixa"||modo==="inteira"))?foto:null;
  const inteira=modo==="inteira";
  const tipoDark=sp.tipo==="capa"||sp.tipo==="cta";
  const bg=cores.fundo||(tipoDark?DARK:"#FFFFFF");
  const claro=corClara(bg)&&!fotoFundo;
  const corTitulo=cores.titulo||(claro?"#1A1630":"#FFFFFF");
  const corTexto=cores.texto||(claro?"#4A4A4A":LAVANDA);
  const corDestaque=claro?(corClara(accent.bg)?"#B8860B":accent.bg):AMARELO;
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  if(fotoFundo)fundoFoto(ctx,fotoFundo,tipoDark);
  else if(claro)pontosClaros(ctx);
  else gridEscuro(ctx);

  if(sp.tipo==="capa"){
    topo(ctx,idx===0?chip:"",accent,!claro);
    const T=String(sp.headline||"").toUpperCase();
    const marks=marcarDestaque(T,String(sp.destaque||"").toUpperCase());
    const subPx=Math.round(38*mult(est,"subtitulo")),subLH=Math.round(subPx*1.47);
    if(fotoFundo){
      // Composição centralizada da ref: título + sub + pill "Arrasta para o lado ›"
      const t=ajustarFonteTit(ctx,est,T,940,92*mult(est,"titulo"),52,5);
      const lineH=Math.round(t.px*t.lh);
      ctx.font="500 "+subPx+"px Inter";
      const subLines=quebrar(ctx,sp.sub,820);
      const blocoH=t.lines.length*lineH+44+subLines.length*subLH+64+90;
      const y=Math.max(320,180+(H-330-blocoH)/2);
      ctx.font=t.font;
      const fimT=desenharLinhasT(ctx,t.lines,marks,W/2,y+t.px,lineH,"center",corTitulo,corDestaque);
      ctx.font="500 "+subPx+"px Inter";ctx.fillStyle=corTexto;
      const fimS=desenharLinhas(ctx,quebrar(ctx,sp.sub,820),W/2,fimT+44,subLH,"center");
      pill(ctx,W/2,fimS+38,"Arrasta para o lado  ›",ROXO,"#FFFFFF",34,true);
    }else{
      balaoDigitando(ctx,80,190,false);
      const t=ajustarFonteTit(ctx,est,T,920,(fotoFixa?70:88)*mult(est,"titulo"),46,fotoFixa?3:5);
      const lineH=Math.round(t.px*t.lh);
      const yT=fotoFixa?320:470;
      ctx.font=t.font;
      const fim=desenharLinhasT(ctx,t.lines,marks,80,yT+t.px,lineH,"left",corTitulo,corDestaque);
      ctx.font="500 "+subPx+"px Inter";ctx.fillStyle=corTexto;
      const fimS=desenharLinhas(ctx,quebrar(ctx,sp.sub,880),80,fim+34,subLH);
      if(fotoFixa)frameAuto(ctx,fotoFixa,fimS+44,inteira);
    }
    metaBar(ctx,idx,total,accent,!claro);
    return;
  }

  if(sp.tipo==="cta"){
    topo(ctx,idx===0?chip:"",accent,!claro);
    const T=String(sp.titulo||"").toUpperCase();
    const marks=marcarDestaque(T,String(sp.destaque||"").toUpperCase());
    const fech=FECHAMENTOS[sp.fechamento]||FECHAMENTOS.comentar;
    const pedidoTxt=fech.pill===null?String(sp.keyword||"").toUpperCase():fech.pill;
    const temPedido=!!(fech.linha&&pedidoTxt);
    const kwPx=Math.round(60*mult(est,"keyword"));
    const alturaPedido=temPedido?Math.round(30+kwPx*2.2+56):0;
    if(!fotoFixa)balaoDigitando(ctx,W/2,temPedido?240:330,true);
    const t=ajustarFonteTit(ctx,est,T,900,(fotoFixa?58:76)*mult(est,"titulo"),44,(fotoFixa||temPedido)?3:4);
    const lineH=Math.round(t.px*t.lh);
    const yT=fotoFixa?240:(temPedido?430:520);
    ctx.font=t.font;
    const fim=desenharLinhasT(ctx,t.lines,marks,W/2,yT+t.px,lineH,"center",corTitulo,corDestaque);
    // O corpo encolhe até o bloco do pedido caber: sem isso a pílula caía por cima dos pontinhos do rodapé
    const tetoCta=(fotoFixa?(H-108-FRAME_MIN-56):(H-150))-alturaPedido;
    let corpoPx=Math.round(40*mult(est,"texto")),linhasC=[];
    while(true){
      ctx.font="400 "+corpoPx+"px Inter";
      linhasC=quebrar(ctx,sp.texto,860);
      if(fim+40+linhasC.length*Math.round(corpoPx*1.5)<=tetoCta||corpoPx<=26)break;
      corpoPx-=2;
    }
    ctx.fillStyle=corTexto;
    const fim2=desenharLinhas(ctx,linhasC,W/2,fim+40,Math.round(corpoPx*1.5),"center");
    let yFim=fim2;
    if(temPedido){
      const yCom=fotoFixa?fim2+64:Math.min(Math.max(fim2+70,880),H-150-Math.round(kwPx*2.2)-30);
      ctx.font="700 30px Inter";ctx.fillStyle=claro?"#6B6487":"rgba(255,255,255,.7)";ctx.textAlign="center";
      ctx.fillText(fech.linha,W/2,yCom);ctx.textAlign="left";
      const kw=pill(ctx,W/2,yCom+30,pedidoTxt,AMARELO,DARK,kwPx,true);
      yFim=yCom+30+kw.h;
    }
    if(fotoFixa)frameAuto(ctx,fotoFixa,yFim+40,inteira);
    metaBar(ctx,idx,total,accent,!claro,true);
    return;
  }

  // Slide interno
  ctx.fillStyle=accent.bg;ctx.fillRect(0,0,14,H);
  topo(ctx,idx===0?chip:"",accent,!claro);

  const mx=96,larg=W-mx-90;
  const etiq=String(sp.etiqueta||"").trim();
  const T=String(sp.titulo||"").toUpperCase();
  const marks=marcarDestaque(T,String(sp.destaque||"").toUpperCase());
  const etiqPx=Math.round(30*mult(est,"etiqueta")),etiqH=Math.round(etiqPx*2.2)+58;
  const blocos=(sp.blocos||[]).filter(b=>String((b&&b.texto)||"").trim());
  const layout=blocos.length?(sp.layout||"texto"):"texto";

  // Mede o bloco inteiro antes de desenhar, pra distribuir na vertical (evita slide com metade vazia)
  const t=ajustarFonteTit(ctx,est,T,larg,(fotoFixa?56:64)*mult(est,"titulo"),36,fotoFixa?3:4);
  const lineHT=Math.round(t.px*t.lh);
  const reservaFrame=layout==="texto"?FRAME_MIN:200;
  const tetoTexto=fotoFixa?(H-108-reservaFrame-56-190):940;
  const cabeca=(etiq?etiqH:30)+t.px+t.lines.length*lineHT+96;

  // O corpo encolhe em LOOP até caber: com 30 a 45 palavras o passo único antigo não dava conta
  let corpo=Math.round(38*mult(est,"texto")),lineH=0,linhas=[],alturaCorpo=0;
  const medir=()=>{
    lineH=Math.round(corpo*1.5);
    ctx.font="400 "+corpo+"px Inter";
    if(layout==="texto"){linhas=quebrar(ctx,sp.texto,larg);alturaCorpo=corpo+linhas.length*lineH;}
    else alturaCorpo=blocosBody(ctx,false,layout,blocos,mx,0,larg,corpo,accent,corTexto,claro);
  };
  medir();
  const pisoCorpo=layout==="texto"?24:20;
  while(cabeca+alturaCorpo>tetoTexto&&corpo>pisoCorpo){corpo-=2;medir();}

  // Com imagem fixa o texto sobe pro topo; sem imagem, centraliza na vertical
  let y=fotoFixa?190:200+Math.max(0,(960-(cabeca+alturaCorpo))*0.5);
  if(etiq){
    const c=cores.etiqueta
      ? {bg:cores.etiqueta,fg:corClara(cores.etiqueta)?DARK:"#FFFFFF"}
      : corEtiqueta(etiq,accent);
    pill(ctx,mx,y,etiq.toUpperCase(),c.bg,c.fg,etiqPx,false);
    y+=etiqH;
  }else y+=30;

  ctx.font=t.font;
  const fimTitulo=desenharLinhasT(ctx,t.lines,marks,mx,y+t.px,lineHT,"left",corTitulo,corDestaque);

  ctx.fillStyle=accent.bg;rr(ctx,mx,fimTitulo+26,150,10,5);ctx.fill();

  let fimTexto;
  if(layout==="texto"){
    ctx.font="400 "+corpo+"px Inter";
    ctx.fillStyle=corTexto;
    fimTexto=desenharLinhas(ctx,linhas,mx,fimTitulo+96+corpo,lineH);
  }else{
    const yB=fimTitulo+92;
    fimTexto=yB+blocosBody(ctx,true,layout,blocos,mx,yB,larg,corpo,accent,corTexto,claro);
  }

  if(fotoFixa)frameAuto(ctx,fotoFixa,fimTexto+50,inteira,reservaFrame);

  metaBar(ctx,idx,total,accent,!claro);
}

function montarSlides(projeto){
  const capa=projeto.capaIdx!=null?projeto.capas[projeto.capaIdx]:null;
  if(!capa||!projeto.cta||!projeto.slides.length) return [];
  const list=[{key:"capa",tipo:"capa",headline:capa.headline,sub:capa.subtitulo,destaque:capa.destaque||"",prompt_imagem:capa.prompt_imagem||""}];
  projeto.slides.forEach((s,i)=>list.push({key:"s"+i,tipo:"interno",etiqueta:s.etiqueta,titulo:s.titulo,texto:s.texto,
    destaque:s.destaque||"",prompt_imagem:s.prompt_imagem||"",layout:s.layout||"texto",blocos:s.blocos||[]}));
  list.push({key:"cta",tipo:"cta",titulo:projeto.cta.titulo,texto:projeto.cta.texto,keyword:projeto.cta.palavra_chave,
    fechamento:projeto.cta.tipo||"comentar",destaque:projeto.cta.destaque||"",prompt_imagem:projeto.cta.prompt_imagem||""});
  return list;
}

const imgCache={};
function loadImage(dataURL){
  if(imgCache[dataURL]) return Promise.resolve(imgCache[dataURL]);
  return new Promise((res,rej)=>{
    const img=new Image();
    img.onload=()=>{imgCache[dataURL]=img;res(img);};
    img.onerror=rej;
    img.src=dataURL;
  });
}
function promptPadrao(sp,projeto){
  if(sp.prompt_imagem)return sp.prompt_imagem;
  const assunto=sp.tipo==="interno"?sp.titulo:(projeto.tema||sp.headline||sp.titulo||"");
  return "Realistic app interface mockup about: "+assunto+". Show the relevant screen or app icons as the subject, filling the frame. Any on-screen label must be short and in Portuguese, in quotes. Clean background, soft shadow, studio lighting. No slide headline, no marketing text, no watermark.";
}

// A IA marca slides que não devem virar imagem gerada. Aqui o painel avisa e trava o botão,
// pra não sair tela inventada da ResponDM nem imagem fraca em slide que ficava melhor limpo.
function avisoSemGeracao(prompt){
  const t=String(prompt||"").trim().toUpperCase();
  if(t.startsWith("PRINT REAL")) return "Este slide mostra a tela da ResponDM. Suba um print de verdade: imagem gerada por IA inventaria uma tela que não existe.";
  if(t.startsWith("SEM IMAGEM")) return "A IA avaliou que este slide funciona melhor só com texto. Se quiser imagem mesmo assim, escreva o prompt por cima deste aviso.";
  return "";
}

        const foto=fotos[sp.key];

        desenharSlide(cv.getContext("2d"),sp,{idx:i,total:specs.length,accent:cat.accent,chip:cat.chip,foto:img,modo:foto?foto.modo:null,estilo:resolverEstilo(projeto,sp.key)});
        urls.push(cv.toDataURL("image/png"));

    return()=>{vivo=false;};
  },[JSON.stringify(projeto.slides),JSON.stringify(projeto.cta),projeto.capaIdx,JSON.stringify(projeto.capas),projeto.categoria,fotos,JSON.stringify(projeto.estilo),JSON.stringify(projeto.ajustes)]);

  function guardarFoto(dataURL){

  }
  async function gerarFotoIA(){
    if(sel==null) return;

      const r=await fetch(WORKER_URL+"/imagem",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({prompt:promptFoto})});
      const data=await r.json();
      if(!r.ok) throw new Error(data?.error?.message||("Erro "+r.status));
      const parts=data?.candidates?.[0]?.content?.parts||[];
      const part=parts.find(p=>(p.inlineData&&p.inlineData.data)||(p.inline_data&&p.inline_data.data));
      if(!part) throw new Error("A IA não retornou imagem. Tente ajustar o prompt.");

`);

CARROSSEL PRONTO (é este post que a legenda acompanha):
`+roteiro

          +" Antes de devolver, confira: a primeira linha tem menos de 125 caracteres e contém a palavra-âncora? Existe UM CTA só? São exatamente 5 hashtags, no fim da legenda? Não sobrou nenhum travessão?",
        schema:SCHEMA_LEGENDA,

      update({legenda:out});
    }catch(e){setErr(String(e.message||e));}
