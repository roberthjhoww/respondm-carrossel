const PROMPT_BASE=`Você escreve carrosséis para o Instagram da ResponDM (@respon_dm).

SOBRE A RESPONDM (use só o que for verdade, nunca invente recurso):
A ResponDM é um SaaS brasileiro de automação de interações no Instagram pela API oficial da Meta. Recursos reais: automação por comentário (comentou a palavra-chave, recebe DM automática), automação por DM, automação por story, resposta pública automática em comentários, Flow (fluxo de mensagens em canvas com condições, delays, tags e coleta de dados), Link Bio, envio só para seguidores. Sempre trate a marca no feminino: "a ResponDM".

PÚBLICO: criadores de conteúdo, infoprodutores, agências e negócios locais brasileiros que querem crescer no Instagram sem contratar equipe.

TOM: criador experiente que vive isso todos os dias, não empresa se vendendo. Português brasileiro coloquial mas inteligente. Frases curtas. Conversa, não palestra. Autoridade sem arrogância.

PARA QUE ALGORITMO VOCÊ ESCREVE (julho/2026):
- O sinal nº 1 do Instagram é a pessoa ENVIAR o post por DM pra um amigo. Todo carrossel precisa passar no teste do DM: "alguém mandaria isso pra alguém específico?". Se não, refaça.
- O 2º sinal é salvar o post. Conteúdo de referência (checklist, resumo, framework) é o que mais gera save.
- Carrossel ranqueia por taxa de conclusão: cada slide precisa segurar a pessoa até o último.

REGRAS DA CAPA (slide 1):
- A capa anuncia o PAYOFF (o que a pessoa ganha, perde ou descobre), NUNCA o assunto. Errado: "Algoritmo do Instagram em 2026". Certo: "Seu alcance caiu 40% e a causa não é o que você pensa".
- Headline: 6 a 12 palavras, 1 ideia, 1 gatilho psicológico só (curiosidade, FOMO/erro, ganho, defesa, alívio ou descrença/contrário). Empilhar gatilhos na mesma frase vira ruído.
- A palavra que o público pesquisaria sobre o tema deve estar escrita na headline ou no subtítulo.
- Números: prefira ímpares e quebrados ("7 erros", "R$ 4.830") a redondos.
- Subtítulo: 1 frase que neutraliza a objeção principal ("mesmo sem X") ou aumenta a tensão.

REGRAS DE CADA SLIDE INTERNO:
- 1 ideia por slide, com pelo menos um dado, número, mecanismo ou situação concreta.
- Título: até 10 palavras, provoca leitura em vez de descrever.
- Texto de apoio: 1 a 2 frases, 15 a 25 palavras, que adicionam algo novo (nunca continuação óbvia do título). O slide inteiro nunca passa de 40 palavras: a janela de leitura é 1,5 segundo.
- Etiqueta = mini-headline de sinalização ("ERRO 3", "PASSO 2", "DADO"), nunca enfeite.
- Cada slide entrega uma micro-revelação completa E abre curiosidade pro próximo. Quando couber, o texto de apoio termina puxando o próximo slide (ex: "e o pior erro é o próximo").
- ESCALADA: os slides vão do bom pro melhor. O insight mais forte do carrossel fica no FIM do desenvolvimento, nunca no começo.
- Em carrosséis com 5+ slides internos, o ÚLTIMO slide interno é um resumo salvável (checklist ou recap de tudo), com etiqueta RESUMO.
- Em carrosséis de 8+ slides no total, um slide do MEIO pode pedir naturalmente pra salvar o post (nunca no final).
- Quando a ResponDM aparecer como solução, nomeie o mecanismo concreto (ex: "a automação por comentário entrega o PDF no direct"), nunca benefício vago. Ela não precisa aparecer em todo carrossel.

CTA FINAL:
- UM pedido só: comentar UMA palavra-chave em maiúsculas pra receber algo no direct (o post vira demonstração da própria ResponDM).
- O título do CTA fecha o círculo com a promessa da capa (loop-back), não introduz assunto novo.

PROIBIDO (nunca use):
- travessão (o caractere —) em qualquer texto
- "Não é sobre X, é sobre Y" / "No mundo de hoje" / "Mais do que nunca" / "cada vez mais" / "de forma eficiente" / "potencializar" / "alavancar" / "transformar seu negócio" / "escalar seu negócio" / "presença digital" / "jornada do cliente" / "chegou a hora" / "não perca mais tempo" / "solução completa" / "resultados incríveis" / "impacto real"
- benefício sem mecanismo que o explique
- headline que anuncia o assunto em vez do payoff
- conclusão óbvia embalada como insight

ESTRUTURA GERAL: slide 1 é a capa (hook de payoff). Slide 2 reduz ceticismo e abre o loop ("nos próximos X slides você vai ver..."). Desenvolvimento em escalada. Resumo salvável quando houver 5+ slides internos. Último slide é o CTA com loop-back.`;

/* ─────────────────────────────────────────────
   Chamada à IA via Worker
   ───────────────────────────────────────────── */
async function chamarIA({system,userText,useWebFetch,schema,maxTokens}){
  const body={
    system,
    messages:[{role:"user",content:userText}],
    thinking:{type:"adaptive"},
    max_tokens:maxTokens||16000,
    output_config:{format:{type:"json_schema",schema}},
  };
  if(useWebFetch) body.tools=[{type:"web_fetch_20260209",name:"web_fetch",max_uses:3}];
  const r=await fetch(WORKER_URL+"/roteiro",{
    method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body),
  });
  let data;
  try{data=await r.json();}catch(e){throw new Error("Resposta inválida do servidor ("+r.status+")");}
  if(!r.ok) throw new Error(data?.error?.message||data?.error||("Erro "+r.status));
  if(data.stop_reason==="refusal") throw new Error("A IA recusou gerar esse conteúdo. Tente reformular o tema.");
  const textos=(data.content||[]).filter(b=>b.type==="text"&&b.text);
  if(!textos.length) throw new Error("A IA não retornou texto. Tente de novo.");
  return JSON.parse(textos[textos.length-1].text);
}

function contextoDoProjeto(p){
  const internos=p.qtdSlides-2;
  let s=`CATEGORIA ESCOLHIDA: ${CATEGORIAS.find(c=>c.id===p.categoria)?.nome||p.categoria}`;
  if(p.tema) s+=`\nTEMA DO CARROSSEL: ${p.tema}`;
  if(p.link) s+=`\nLINK DE MATÉRIA (leia a página com web_fetch e use como base factual do conteúdo): ${p.link}`;
  if(p.textoPronto) s+=`\nTEXTO BASE (adapte ESTE conteúdo para os slides, sem inventar fatos que não estão nele):\n"""\n${p.textoPronto}\n"""`;
  s+=`\nTOTAL DE SLIDES: ${p.qtdSlides} (slide 1 = capa, ${internos} slides internos, último slide = CTA)`;
  return s;
}

function LoginScreen(){
  const [loading,setLoading]=useState(false);

    "auth/popup-closed-by-user":"Login cancelado.",
    "auth/popup-blocked":"O navegador bloqueou a janela de login. Permita pop-ups e tente de novo.",
    "auth/unauthorized-domain":"Este domínio não está autorizado no Firebase.",
    "auth/network-request-failed":"Sem conexão com a internet.",
  };
  async function handleGoogleLogin(){
    setLoading(true);setErr("");
    try{
      const provider=new firebase.auth.GoogleAuthProvider();
      provider.setCustomParameters({prompt:"select_account"});
      await fbAuth.signInWithPopup(provider);

    <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>

            <div style={{fontSize:28,marginBottom:8}}>{c.emoji}</div>
            <div style={{fontWeight:800,fontSize:15,marginBottom:4}}>{c.nome}</div>
            <div style={{fontSize:13,color:"var(--text2)"}}>{c.desc}</div>
          </Card>
        ))}
      </div>
    </div>
  );
}

/* ─────────────────────────────────────────────
   Etapa 2 — Tema
   ───────────────────────────────────────────── */
function StepTema({projeto,update,next,back}){
  const podeAvancar=!!(projeto.tema.trim()||projeto.link.trim()||projeto.textoPronto.trim());
  const cat=CATEGORIAS.find(c=>c.id===projeto.categoria);
  return(
    <div>
      <h2 style={{fontSize:22,fontWeight:800,marginBottom:6}}>Sobre o que é o carrossel?</h2>
      <p style={{color:"var(--text2)",marginBottom:22}}>
        {cat?<span>Categoria: <b style={{color:"var(--purple)"}}>{cat.emoji} {cat.nome}</b> · </span>:null}
        Preencha pelo menos um dos campos abaixo.
      </p>
      <Card style={{marginBottom:20}}>
        <Field label="Tema do carrossel">
          <textarea rows={3} style={{...inputStyle,resize:"vertical"}} value={projeto.tema}
            placeholder="Ex.: O Instagram mudou o alcance de contas pequenas em 2026. O que muda e como aproveitar."
            onChange={e=>update({tema:e.target.value})}/>
        </Field>
        <Field label="Link de matéria (opcional, a IA lê a página e usa como base)">
          <input type="url" style={inputStyle} value={projeto.link}
            placeholder="https://exemplo.com/materia"
            onChange={e=>update({link:e.target.value})}/>
        </Field>
        <Field label="Texto pronto (opcional, a IA só adapta pro formato de slides, sem inventar)">
          <textarea rows={5} style={{...inputStyle,resize:"vertical"}} value={projeto.textoPronto}
            placeholder="Cole aqui um briefing, roteiro de vídeo ou texto que você já tem..."
            onChange={e=>update({textoPronto:e.target.value})}/>
        </Field>
        <Field label="Quantidade de slides (contando capa e CTA)">
          <div style={{display:"flex",alignItems:"center",gap:14}}>
            <Btn variant="secondary" style={{padding:"8px 16px"}} onClick={()=>update({qtdSlides:Math.max(4,projeto.qtdSlides-1)})}>−</Btn>
            <div style={{fontSize:22,fontWeight:800,minWidth:32,textAlign:"center"}}>{projeto.qtdSlides}</div>
            <Btn variant="secondary" style={{padding:"8px 16px"}} onClick={()=>update({qtdSlides:Math.min(10,projeto.qtdSlides+1)})}>+</Btn>
            <span style={{fontSize:12,color:"var(--text3)"}}>de 4 a 10 · padrão 8</span>
          </div>
        </Field>
      </Card>
      <div style={{display:"flex",justifyContent:"space-between"}}>
        <Btn variant="secondary" onClick={back}>← Voltar</Btn>
        <Btn onClick={next} disabled={!podeAvancar}>Continuar →</Btn>
      </div>
    </div>
  );
}

/* ─────────────────────────────────────────────
   Etapa 3 — Roteiro (capas → roteiro → edição)
   ───────────────────────────────────────────── */
function StepRoteiro({projeto,update,next,back}){
  const [busy,setBusy]=useState("");   // "" | "capas" | "roteiro"
  const [err,setErr]=useState("");

  async function gerarCapas(){
    setBusy("capas");setErr("");
    try{
      const out=await chamarIA({
        system:PROMPT_BASE+"\n\n"+PROMPT_CATEGORIA[projeto.categoria],
        userText:contextoDoProjeto(projeto)+`\n\nTAREFA: gere exatamente 3 opções de CAPA para este carrossel, cada uma com um gatilho psicológico DIFERENTE (escolha 3 entre: curiosidade, FOMO/erro, ganho concreto, defesa, alívio, descrença/contrário). Cada headline anuncia o PAYOFF, nunca o assunto, em 6 a 12 palavras, e precisa passar no teste do DM: alguém mandaria essa capa pra um amigo específico. Subtítulo: 1 frase que neutraliza a objeção principal ou aumenta a tensão.`,
        useWebFetch:!!projeto.link.trim(),
        schema:SCHEMA_CAPAS,
        maxTokens:8000,
      });
      update({capas:out.capas||[],capaIdx:null,slides:[],cta:null});
    }catch(e){setErr(String(e.message||e));}
    setBusy("");
  }

  async function gerarRoteiro(){
    const capa=projeto.capas[projeto.capaIdx];
    if(!capa) return;
    setBusy("roteiro");setErr("");
    try{
      const internos=projeto.qtdSlides-2;
      const out=await chamarIA({
        system:PROMPT_BASE+"\n\n"+PROMPT_CATEGORIA[projeto.categoria],
        userText:contextoDoProjeto(projeto)
          +`\n\nCAPA JÁ ESCOLHIDA (slide 1, não recrie):\nHeadline: ${capa.headline}\nSubtítulo: ${capa.subtitulo}`
          +`\n\nTAREFA: escreva os ${internos} slides internos (slide 2 até o slide ${projeto.qtdSlides-1}) alinhados a essa capa, e o slide final de CTA. O slide 2 reduz ceticismo e abre o loop. Desenvolva em ESCALADA: o insight mais forte fica no fim do desenvolvimento. ${internos>=5?"O último slide interno é um resumo salvável (etiqueta RESUMO) de tudo que foi entregue. ":""}Cada slide entrega uma micro-revelação e abre curiosidade pro próximo. O CTA fecha o círculo com a promessa da capa. Antes de devolver, valide cada slide: passa no teste do DM? Tem dado, número ou mecanismo concreto? Está dentro de 40 palavras? Devolva no campo "slides" exatamente ${internos} itens, na ordem.`,
        useWebFetch:!!projeto.link.trim(),
        schema:SCHEMA_ROTEIRO,
        maxTokens:16000,
      });
      update({slides:out.slides||[],cta:out.cta||null});
    }catch(e){setErr(String(e.message||e));}
    setBusy("");
  }

  function setSlide(i,campo,valor){
    const slides=projeto.slides.map((s,j)=>j===i?{...s,[campo]:valor}:s);
    update({slides});
  }
  function setCapa(campo,valor){
    const capas=projeto.capas.map((c,j)=>j===projeto.capaIdx?{...c,[campo]:valor}:c);
    update({capas});
  }

  const capaEscolhida=projeto.capaIdx!=null?projeto.capas[projeto.capaIdx]:null;
  const temRoteiro=projeto.slides.length>0&&projeto.cta;

  return(
    <div>
      <h2 style={{fontSize:22,fontWeight:800,marginBottom:6}}>Roteiro</h2>
      <p style={{color:"var(--text2)",marginBottom:22}}>Primeiro a IA sugere 3 capas. Você escolhe uma, ela escreve o roteiro completo, e você edita o que quiser.</p>
      <ErrBox msg={err} onClose={()=>setErr("")}/>

      {/* ── Bloco 1: capas ── */}
      {projeto.capas.length===0?(
        <Card style={{textAlign:"center",padding:36,marginBottom:20}}>
          <Btn onClick={gerarCapas} disabled={!!busy}>
            {busy==="capas"?<span><span className="spinner"/>Gerando capas...</span>:"✨ Gerar 3 opções de capa"}
          </Btn>
          <div style={{fontSize:12,color:"var(--text3)",marginTop:12}}>Usa a IA (Claude). Leva alguns segundos.</div>
        </Card>
      ):(
        <div style={{marginBottom:24}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
            <div style={{fontWeight:800,fontSize:15}}>1. Escolha a capa</div>
            <Btn variant="ghost" onClick={gerarCapas} disabled={!!busy}>{busy==="capas"?"Gerando...":"↻ Gerar outras 3"}</Btn>
          </div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(240px,1fr))",gap:12}}>
            {projeto.capas.map((c,i)=>(
              <Card key={i} selected={projeto.capaIdx===i} onClick={()=>update({capaIdx:i})}>
                <div style={{fontSize:11,fontWeight:700,color:projeto.capaIdx===i?"var(--purple)":"var(--text3)",marginBottom:8}}>OPÇÃO {i+1}{projeto.capaIdx===i?" · ESCOLHIDA":""}</div>
                <div style={{fontWeight:800,fontSize:15,lineHeight:1.3,marginBottom:6}}>{c.headline}</div>
                <div style={{fontSize:13,color:"var(--text2)"}}>{c.subtitulo}</div>
              </Card>
            ))}
          </div>
        </div>
      )}

      {/* ── Bloco 2: gerar roteiro ── */}
      {capaEscolhida&&!temRoteiro&&(
        <Card style={{textAlign:"center",padding:36,marginBottom:20}}>
          <Btn onClick={gerarRoteiro} disabled={!!busy}>
            {busy==="roteiro"?<span><span className="spinner"/>Escrevendo o roteiro...</span>:`✍️ Gerar roteiro completo (${projeto.qtdSlides} slides)`}
          </Btn>
        </Card>
      )}

      {/* ── Bloco 3: edição ── */}
      {temRoteiro&&(
        <div style={{marginBottom:24}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
            <div style={{fontWeight:800,fontSize:15}}>2. Revise e edite o roteiro</div>
            <Btn variant="ghost" onClick={gerarRoteiro} disabled={!!busy}>{busy==="roteiro"?"Gerando...":"↻ Regenerar roteiro"}</Btn>
          </div>

          <Card style={{marginBottom:12,borderLeft:"5px solid var(--purple)"}}>
            <div style={{fontSize:11,fontWeight:800,color:"var(--purple)",marginBottom:10}}>SLIDE 1 · CAPA</div>
            <Field label="Headline">
              <textarea rows={2} style={{...inputStyle,fontWeight:700,resize:"vertical"}} value={capaEscolhida.headline} onChange={e=>setCapa("headline",e.target.value)}/>
            </Field>
            <Field label="Subtítulo">
              <input style={inputStyle} value={capaEscolhida.subtitulo} onChange={e=>setCapa("subtitulo",e.target.value)}/>
            </Field>
          </Card>

          {projeto.slides.map((s,i)=>(
            <Card key={i} style={{marginBottom:12}}>
              <div style={{fontSize:11,fontWeight:800,color:"var(--text3)",marginBottom:10}}>SLIDE {i+2}</div>
              <div style={{display:"flex",gap:12,flexWrap:"wrap"}}>
                <div style={{width:150}}>
                  <Field label="Etiqueta">
                    <input style={inputStyle} value={s.etiqueta} onChange={e=>setSlide(i,"etiqueta",e.target.value)}/>
                  </Field>
                </div>
                <div style={{flex:1,minWidth:220}}>
                  <Field label="Título">
                    <textarea rows={2} style={{...inputStyle,fontWeight:700,resize:"vertical"}} value={s.titulo} onChange={e=>setSlide(i,"titulo",e.target.value)}/>
                  </Field>
                </div>
              </div>
              <Field label="Texto de apoio">
                <textarea rows={2} style={{...inputStyle,resize:"vertical"}} value={s.texto} onChange={e=>setSlide(i,"texto",e.target.value)}/>
              </Field>
            </Card>
          ))}

          <Card style={{borderLeft:"5px solid var(--yellow)"}}>
            <div style={{fontSize:11,fontWeight:800,color:"var(--text2)",marginBottom:10}}>SLIDE {projeto.qtdSlides} · CTA</div>
            <Field label="Título">
              <textarea rows={2} style={{...inputStyle,fontWeight:700,resize:"vertical"}} value={projeto.cta.titulo} onChange={e=>update({cta:{...projeto.cta,titulo:e.target.value}})}/>
            </Field>
            <Field label="Texto">
              <textarea rows={2} style={{...inputStyle,resize:"vertical"}} value={projeto.cta.texto} onChange={e=>update({cta:{...projeto.cta,texto:e.target.value}})}/>
            </Field>
            <Field label="Palavra-chave do comentário (vira o gatilho da automação na ResponDM)">
              <input style={{...inputStyle,fontWeight:800,textTransform:"uppercase",maxWidth:240}} value={projeto.cta.palavra_chave} onChange={e=>update({cta:{...projeto.cta,palavra_chave:e.target.value.toUpperCase()}})}/>
            </Field>
          </Card>
        </div>
      )}

      <div style={{display:"flex",justifyContent:"space-between"}}>
        <Btn variant="secondary" onClick={back}>← Voltar</Btn>
        <Btn onClick={next} disabled={!temRoteiro}>Avançar para os Slides →</Btn>
      </div>
    </div>
  );
}

/* ─────────────────────────────────────────────
   Etapa 4 — Slides (Fase 3, ainda não construída)
   ───────────────────────────────────────────── */
function StepSlides({back}){
  return(
    <div>
      <h2 style={{fontSize:22,fontWeight:800,marginBottom:6}}>Slides</h2>
      <div style={{background:"var(--surface)",border:"1.5px dashed var(--border2)",borderRadius:16,padding:48,textAlign:"center",color:"var(--text3)",marginBottom:20}}>
        <div style={{fontSize:16,fontWeight:700,color:"var(--text2)",marginBottom:8}}>Motor visual em construção (Fase 3)</div>
        <div>Aqui os slides serão desenhados em 1080×1350 com os templates da marca,<br/>com opção de fundo por template, imagem gerada por IA ou upload.</div>
      </div>
      <Btn variant="secondary" onClick={back}>← Voltar ao roteiro</Btn>
    </div>
  );
}

/* ─────────────────────────────────────────────
   App
   ───────────────────────────────────────────── */
const PROJETO_VAZIO={categoria:null,tema:"",link:"",textoPronto:"",qtdSlides:8,capas:[],capaIdx:null,slides:[],cta:null};

function App(){
  const [authReady,setAuthReady]=useState(false);
  const [user,setUser]=useState(null);
  const [denied,setDenied]=useState(false);
  const [step,setStep]=useState(0);
  const [projeto,setProjeto]=useState(()=>{
    try{const d=localStorage.getItem(DRAFT_KEY);if(d) return {...PROJETO_VAZIO,...JSON.parse(d)};}catch(e){}
    return {...PROJETO_VAZIO};
  });

  useEffect(()=>{
    const unsub=fbAuth.onAuthStateChanged(u=>{
      setAuthReady(true);
      if(u&&u.email&&!AUTHORIZED_EMAILS.includes(u.email.toLowerCase())){
        setDenied(true);setUser(null);
        fbAuth.signOut();
        return;
      }
      if(!u){setUser(null);return;}
      setDenied(false);setUser(u);
    });
    return unsub;
  },[]);

  useEffect(()=>{
    try{localStorage.setItem(DRAFT_KEY,JSON.stringify(projeto));}catch(e){}
  },[projeto]);

  function update(patch){setProjeto(p=>({...p,...patch}));}
  function novo(){
    if(projeto.slides.length&&!window.confirm("Começar um carrossel novo? O rascunho atual será apagado."))return;
    setProjeto({...PROJETO_VAZIO});setStep(0);
  }

  if(!authReady) return null;
  if(denied) return <DeniedScreen/>;
  if(!user) return <LoginScreen/>;

  return(
    <div>
      <TopBar step={step} setStep={setStep} onNovo={novo}/>
      {step===0&&<StepCategoria projeto={projeto} update={update} next={()=>setStep(1)}/>}
      {step===1&&<StepTema projeto={projeto} update={update} next={()=>setStep(2)} back={()=>setStep(0)}/>}
      {step===2&&<StepRoteiro projeto={projeto} update={update} next={()=>setStep(3)} back={()=>setStep(1)}/>}
      {step===3&&<StepSlides back={()=>setStep(2)}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
