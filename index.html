  }
  function copiar(txt,qual){
    if(!navigator.clipboard){setErr("Seu navegador não deixou copiar. Selecione o texto e use Ctrl+C.");return;}
    navigator.clipboard.writeText(txt).then(()=>{
      setCopiado(qual);setTimeout(()=>setCopiado(""),1800);
    }).catch(()=>setErr("Não consegui copiar. Selecione o texto e use Ctrl+C."));
  }
  function baixarSlide(i){
    const a=document.createElement("a");
    a.href=thumbs[i];a.download="respondm_slide_"+String(i+1).padStart(2,"0")+".png";a.click();
  }
  async function baixarZip(){
    const zip=new JSZip();
    thumbs.forEach((t,i)=>zip.file("respondm_slide_"+String(i+1).padStart(2,"0")+".png",t.split(",")[1],{base64:true}));
    const blob=await zip.generateAsync({type:"blob"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);a.download="carrossel_respondm.zip";a.click();
    URL.revokeObjectURL(a.href);
  }

  return(
    <div>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:12,marginBottom:6}}>
        <h2 style={{fontSize:22,fontWeight:800}}>Seus slides</h2>
        <div style={{display:"flex",gap:10}}>
          <Btn variant="secondary" onClick={()=>setFeed(true)} disabled={renderizando||!thumbs.length}>👁 Ver no feed</Btn>
          <Btn onClick={baixarZip} disabled={renderizando||!thumbs.length}>⬇ Baixar todos (.zip)</Btn>
        </div>
      </div>
      <p style={{color:"var(--text2)",marginBottom:22}}>Clique num slide pra ajustar imagem, tamanhos, cores e fonte. O texto é sempre desenhado em código, nítido.</p>
      <ErrBox msg={err} onClose={()=>setErr("")}/>
      {renderizando&&<div style={{fontSize:13,color:"var(--text3)",marginBottom:12}}>Desenhando slides...</div>}

      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(180px,1fr))",gap:14,marginBottom:22}}>
        {thumbs.map((t,i)=>(
          <div key={i}>
            <img src={t} onClick={()=>setSel(sel===i?null:i)} style={{width:"100%",borderRadius:12,cursor:"pointer",display:"block",
              border:"3px solid "+(sel===i?"var(--purple)":"var(--border)"),boxShadow:"var(--shadow-sm)"}}/>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginTop:4}}>
              <span style={{fontSize:11,fontWeight:700,color:"var(--text3)"}}>{i+1} · {specs[i].tipo.toUpperCase()}{fotos[specs[i].key]?" · 🖼":""}</span>
              <button onClick={()=>baixarSlide(i)} title="Baixar PNG" style={{border:"none",background:"none",cursor:"pointer",fontSize:14,color:"var(--purple)",fontWeight:800}}>⬇</button>
            </div>
          </div>
        ))}
      </div>

      {sel!=null&&specs[sel]&&(()=>{
        const tipo=specs[sel].tipo;
        const f=fotos[specs[sel].key];
        const est=resolverEstilo(projeto,specs[sel].key);
        const cores={...coresPadrao(tipo,cat.accent,specs[sel].etiqueta),...(est.cores||{})};
        const secao={fontSize:12,fontWeight:800,textTransform:"uppercase",letterSpacing:.5,color:"var(--purple)",margin:"18px 0 10px"};
        return(
        <Card style={{marginBottom:22,borderLeft:"5px solid var(--purple)"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:10}}>
            <div style={{fontWeight:800,fontSize:15}}>Ajustes do slide {sel+1}</div>
            <div style={{display:"flex",alignItems:"center",gap:8}}>
              <span style={{fontSize:11,fontWeight:700,color:"var(--text3)"}}>APLICAR EM:</span>
              <Seg value={escopo==="slide"?"Só este slide":"Todos"} options={["Só este slide","Todos"]}
                onChange={v=>setEscopo(v==="Todos"?"global":"slide")}/>
            </div>
          </div>

          {/* Preview do slide ao lado dos controles: sticky pra acompanhar a rolagem do painel */}
          <div style={{display:"flex",gap:22,flexWrap:"wrap",marginTop:4}}>
            <div style={{width:230,flexShrink:0}}>
              <img src={thumbs[sel]} style={{width:"100%",borderRadius:10,display:"block",position:"sticky",top:16,border:"1px solid var(--border)",boxShadow:"var(--shadow-sm)"}}/>
            </div>
            <div style={{flex:1,minWidth:300}}>
          <div style={secao}>Imagem</div>
          {f&&(
            <Field label="Como a imagem entra no slide">
              <Seg value={MODO_NOME[f.modo]||MODO_NOME.fundo} options={["Fundo do slide","Print recortado","Print inteiro"]}
                onChange={v=>setModo(v==="Fundo do slide"?"fundo":(v==="Print inteiro"?"inteira":"fixa"))}/>
              <div style={{fontSize:11,color:"var(--text3)",marginTop:6}}>
                {f.modo==="inteira"
                  ?"A imagem aparece inteira, sem cortar nada. Ideal pra print da tela da ResponDM."
                  :(f.modo==="fundo"
                    ?"A imagem ocupa o slide todo, atrás do texto, com escurecimento e vinheta."
                    :"O print preenche a moldura embaixo do texto e vaza pro rodapé. Pode cortar as bordas da imagem.")}
              </div>
            </Field>
          )}
          {avisoSemGeracao(promptFoto)&&(
            <div style={{fontSize:13,fontWeight:600,color:"var(--text)",background:"var(--purple-light)",border:"1.5px solid var(--purple-mid)",borderRadius:11,padding:"10px 14px",marginBottom:14}}>
              {avisoSemGeracao(promptFoto)}
            </div>
          )}
          <Field label="Prompt da imagem (a IA do roteiro já sugere um, edite à vontade)">
            <textarea rows={3} style={{...inputStyle,resize:"vertical"}} value={promptFoto} onChange={e=>setPromptFoto(e.target.value)}/>
          </Field>
          <div style={{display:"flex",gap:10,flexWrap:"wrap"}}>
            <Btn onClick={gerarFotoIA} disabled={busyFoto||!!avisoSemGeracao(promptFoto)}>
              {busyFoto?<span><span className="spinner"/>Gerando imagem...</span>:"✨ Gerar com IA"}
            </Btn>
            <label style={{display:"inline-block"}}>
              <span style={{display:"inline-block",padding:"12px 22px",borderRadius:12,fontWeight:700,fontSize:14,cursor:"pointer",border:"1.5px solid var(--border2)",background:"var(--surface)"}}>📁 Subir imagem</span>
              <input type="file" accept="image/*" onChange={subirFoto} style={{display:"none"}}/>
            </label>
            <Btn variant="secondary" onClick={()=>copiar(promptFoto,"prompt")}>
              {copiado==="prompt"?"✓ Copiado":"📋 Copiar prompt"}
            </Btn>
            {f&&<Btn variant="secondary" onClick={removerFoto}>Remover imagem</Btn>}
          </div>
          <div style={{fontSize:11,color:"var(--text3)",marginTop:12}}>As imagens não ficam salvas no rascunho: se fechar a aba, será preciso gerar ou subir de novo.</div>

          <div style={secao}>Tamanhos</div>
          {COMPONENTES[tipo].map(([comp,label])=>(
            <div key={comp} style={{display:"flex",alignItems:"center",gap:12,marginBottom:8}}>
              <span style={{width:110,fontSize:13,fontWeight:600,color:"var(--text2)"}}>{label}</span>
              <Seg value={(est.tamanhos||{})[comp]||"M"} options={["P","M","G","GG"]}
                onChange={v=>setAjuste({tamanhos:{[comp]:v}})}/>
            </div>
          ))}

          <div style={secao}>Fonte dos títulos</div>
          <select value={est.fonteTitulo} onChange={e=>setAjuste({fonteTitulo:e.target.value})} style={{...inputStyle,maxWidth:240}}>
            {Object.keys(FONTES).map(f2=><option key={f2} value={f2}>{f2}</option>)}
          </select>

          <div style={secao}>Cores</div>
          <div style={{display:"flex",gap:18,flexWrap:"wrap",alignItems:"flex-end"}}>
            {[["fundo","Fundo"],["titulo","Título"],["texto","Texto de apoio"],["acento","Acento"]].concat(tipo==="interno"?[["etiqueta","Etiqueta"]]:[]).map(([c,label])=>(
              <label key={c} style={{display:"flex",flexDirection:"column",gap:4,fontSize:12,fontWeight:600,color:"var(--text2)",cursor:"pointer"}}>
                {label}
                <input type="color" value={cores[c]} onChange={e=>setAjuste({cores:{[c]:e.target.value}})}
                  style={{width:64,height:34,border:"1.5px solid var(--border2)",borderRadius:8,padding:2,cursor:"pointer",background:"var(--surface)"}}/>
              </label>
            ))}
            <Btn variant="ghost" onClick={resetarEstilo}>↺ Resetar {escopo==="global"?"ajustes globais":"ajustes deste slide"}</Btn>
          </div>
            </div>
          </div>
        </Card>
        );
      })()}

      {/* ── Legenda do post ── */}
      <Card style={{marginBottom:22,borderLeft:"5px solid var(--yellow)"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:12,marginBottom:projeto.legenda?14:0}}>
          <div>
            <div style={{fontWeight:800,fontSize:15}}>Legenda do post</div>
            <div style={{fontSize:12,color:"var(--text3)",marginTop:2}}>Escrita a partir do carrossel, otimizada pra busca e pro algoritmo.</div>
          </div>
          <Btn variant={projeto.legenda?"secondary":"primary"} onClick={gerarLegenda} disabled={busyLegenda}>
            {busyLegenda?<span><span className="spinner"/>Escrevendo...</span>:(projeto.legenda?"↻ Gerar outra":"✍️ Gerar legenda")}
          </Btn>
        </div>

        {projeto.legenda&&(
          <div>
            <Field label="Legenda completa (já com hook, CTA e hashtags, pronta pra colar)">
              <textarea rows={16} style={{...inputStyle,resize:"vertical",lineHeight:1.6}} value={projeto.legenda.legenda}
                onChange={e=>update({legenda:{...projeto.legenda,legenda:e.target.value}})}/>
            </Field>
            <div style={{display:"flex",gap:10,flexWrap:"wrap",alignItems:"center",marginBottom:18}}>
              <Btn onClick={()=>copiar(projeto.legenda.legenda,"legenda")}>
                {copiado==="legenda"?"✓ Copiado":"📋 Copiar legenda"}
              </Btn>
              <span style={{fontSize:12,color:"var(--text3)"}}>{projeto.legenda.legenda.length} caracteres</span>
            </div>

            <Field label="Texto alternativo do primeiro slide (Configurações avançadas, antes de publicar)">
              <textarea rows={2} style={{...inputStyle,resize:"vertical"}} value={projeto.legenda.alt_text}
                onChange={e=>update({legenda:{...projeto.legenda,alt_text:e.target.value}})}/>
            </Field>
            <Btn variant="secondary" onClick={()=>copiar(projeto.legenda.alt_text,"alt")} style={{marginBottom:18}}>
              {copiado==="alt"?"✓ Copiado":"📋 Copiar alt text"}
            </Btn>

            <div style={{background:"var(--surface2)",borderRadius:12,padding:"12px 16px"}}>
              <div style={{fontSize:11,fontWeight:800,textTransform:"uppercase",letterSpacing:.5,color:"var(--text2)",marginBottom:8}}>
                Palavra-âncora de busca: <span style={{color:"var(--purple)"}}>{projeto.legenda.palavra_ancora}</span>
              </div>
              <div style={{fontSize:11,fontWeight:800,textTransform:"uppercase",letterSpacing:.5,color:"var(--text2)",marginBottom:6}}>Outras primeiras linhas pra testar</div>
              {(projeto.legenda.hooks_alternativos||[]).map((h,i)=>(
                <div key={i} style={{fontSize:13,color:"var(--text2)",padding:"5px 0",display:"flex",gap:8}}>
                  <span style={{color:"var(--text3)",fontWeight:700}}>{i+1}.</span><span>{h}</span>
                </div>
              ))}
            </div>

            {(projeto.cta||{}).palavra_chave&&(
              <div style={{fontSize:12,color:"var(--text2)",marginTop:14,background:"var(--purple-light)",borderRadius:10,padding:"10px 14px"}}>
                Antes de publicar, deixe a automação da palavra <b>{projeto.cta.palavra_chave}</b> criada na ResponDM. Dá pra usar o "Aguardar próximo post" e ela se vincula sozinha quando o post entrar no ar.
              </div>
            )}
          </div>
        )}
      </Card>

      {feed&&<FeedModal thumbs={thumbs} headline={(projeto.capas[projeto.capaIdx]||{}).headline||""} onClose={()=>setFeed(false)}/>}

      <Btn variant="secondary" onClick={back}>← Voltar ao roteiro</Btn>
    </div>
  );
}

/* ─────────────────────────────────────────────
   Meus carrosséis (persistência no Firestore)
   ───────────────────────────────────────────── */
function TelaProjetos({onAbrir,onVoltar,idAtual}){
  const [lista,setLista]=useState(null);
  const [thumbs,setThumbs]=useState({});
  const [err,setErr]=useState("");

  useEffect(()=>{
    let vivo=true;
    fbDB.collection("projetos").orderBy("atualizadoEm","desc").limit(60).get()
      .then(snap=>{if(vivo)setLista(snap.docs.map(d=>({id:d.id,...d.data()})));})
      .catch(e=>{if(vivo){setErr("Não consegui carregar a lista: "+(e.message||e));setLista([]);}});
    return()=>{vivo=false;};
  },[]);

  // A capa de cada carrossel é desenhada pelo mesmo engine dos slides
  useEffect(()=>{
    if(!lista||!lista.length) return;
    let vivo=true;
    (async()=>{
      const fams=new Set(lista.map(p=>((p.estilo||{}).fonteTitulo)||"Anton"));
      try{
        await Promise.all([
          ...[...fams].map(f=>document.fonts.load((FONTES[f]||FONTES.Anton).peso+" 90px '"+f+"'")),
          document.fonts.load("500 38px Inter"),document.fonts.load("600 28px Inter"),
        ]);
      }catch(e){}
      const out={};
      for(const p of lista){
        const capa=(p.capas||[])[p.capaIdx||0];
        if(!capa) continue;
        const cat=CATEGORIAS.find(c=>c.id===p.categoria)||CATEGORIAS[0];
        const cv=document.createElement("canvas");cv.width=W;cv.height=H;
        desenharSlide(cv.getContext("2d"),
          {tipo:"capa",headline:capa.headline,sub:capa.subtitulo,destaque:capa.destaque||""},
          {idx:0,total:p.qtdSlides||8,accent:cat.accent,chip:cat.chip,estilo:resolverEstilo(p,"capa")});
        out[p.id]=cv.toDataURL("image/png");
      }
      if(vivo)setThumbs(out);
    })();
    return()=>{vivo=false;};
  },[lista]);

  async function excluir(p){
    if(!window.confirm("Excluir este carrossel de vez? Não dá pra desfazer.")) return;
    try{
      await fbDB.collection("projetos").doc(p.id).delete();
      setLista(l=>l.filter(x=>x.id!==p.id));
    }catch(e){setErr("Não consegui excluir: "+(e.message||e));}
  }
  function quando(p){
    const d=p.atualizadoEm&&p.atualizadoEm.toDate?p.atualizadoEm.toDate():null;
    if(!d) return "agora há pouco";
    return d.toLocaleDateString("pt-BR")+" às "+d.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
  }

  return(
    <div>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:12,marginBottom:6}}>
        <h2 style={{fontSize:22,fontWeight:800}}>Meus carrosséis</h2>
        <Btn variant="secondary" onClick={onVoltar}>← Voltar ao carrossel atual</Btn>
      </div>
      <p style={{color:"var(--text2)",marginBottom:22}}>Tudo que você escreve é salvo sozinho. As imagens dos slides não ficam salvas ainda: ao reabrir, gere ou suba de novo.</p>
      <ErrBox msg={err} onClose={()=>setErr("")}/>

      {lista===null&&<div style={{color:"var(--text3)",padding:30,textAlign:"center"}}>Carregando...</div>}
      {lista&&lista.length===0&&!err&&(
        <div style={{background:"var(--surface)",border:"1.5px dashed var(--border2)",borderRadius:16,padding:48,textAlign:"center",color:"var(--text3)"}}>
          Nenhum carrossel salvo ainda. Assim que a IA gerar as capas, ele aparece aqui sozinho.
        </div>
      )}

      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(230px,1fr))",gap:16}}>
        {(lista||[]).map(p=>{
          const cat=CATEGORIAS.find(c=>c.id===p.categoria);
          const capa=(p.capas||[])[p.capaIdx||0];
          return(
            <Card key={p.id} selected={p.id===idAtual} style={{padding:12}}>
              {thumbs[p.id]
                ? <img src={thumbs[p.id]} onClick={()=>onAbrir(p)} style={{width:"100%",borderRadius:9,display:"block",cursor:"pointer",border:"1px solid var(--border)"}}/>
                : <div style={{width:"100%",aspectRatio:"1080/1350",borderRadius:9,background:"var(--surface2)"}}/>}
              <div style={{fontSize:13,fontWeight:700,lineHeight:1.35,margin:"10px 0 4px"}}>{capa?capa.headline:"(sem capa)"}</div>
              <div style={{fontSize:11,color:"var(--text3)",marginBottom:10}}>
                {cat?cat.emoji+" "+cat.nome:"?"} · {(p.slides||[]).length+2} slides<br/>{quando(p)}
                {p.id===idAtual?<span style={{color:"var(--purple)",fontWeight:800}}><br/>Aberto agora</span>:null}
              </div>
              <div style={{display:"flex",gap:8}}>
                <Btn style={{padding:"8px 14px",fontSize:13,flex:1}} onClick={()=>onAbrir(p)}>Abrir</Btn>
                <Btn variant="secondary" style={{padding:"8px 12px",fontSize:13}} onClick={()=>excluir(p)} title="Excluir">🗑</Btn>
              </div>
            </Card>
          );
        })}
      </div>
    </div>
  );
}

/* ─────────────────────────────────────────────
   App
   ───────────────────────────────────────────── */

const PROJETO_VAZIO={id:null,categoria:null,tema:"",link:"",textoPronto:"",qtdSlides:8,capas:[],capaIdx:null,slides:[],cta:null,estilo:{fonteTitulo:"Anton",tamanhos:{},cores:{}},ajustes:{},legenda:null};

function App(){
  const [authReady,setAuthReady]=useState(false);
  const [user,setUser]=useState(null);
  const [denied,setDenied]=useState(false);
  const [step,setStep]=useState(0);
  const [tela,setTela]=useState("wizard");        // "wizard" | "projetos"
  const [statusSalvo,setStatusSalvo]=useState("");
  const [fotos,setFotos]=useState({}); // imagens de fundo por slide (só em memória, dataURLs pesam demais pro localStorage e pro Firestore)
  const timerSalvar=useRef(null);
  const ultimoSalvo=useRef("");   // último JSON gravado, evita reescrever o que não mudou
  const idRef=useRef(null);       // id do doc já criado, sincronizado antes do estado
  const salvando=useRef(false);
  const [projeto,setProjeto]=useState(()=>{
    try{const d=localStorage.getItem(DRAFT_KEY);if(d) return {...PROJETO_VAZIO,...JSON.parse(d)};}catch(e){}
    return {...PROJETO_VAZIO};
  });

  useEffect(()=>{
    const unsub=fbAuth.onAuthStateChanged(u=>{
      setAuthReady(true);
      if(u&&u.email&&!AUTHORIZED_EMAILS.includes(u.email.toLowerCase())){
        setDenied(true);setUser(null);
        fbAuth.signOut();
        return;
      }
      if(!u){setUser(null);return;}
      setDenied(false);setUser(u);
    });
    return unsub;
  },[]);

  useEffect(()=>{
    try{localStorage.setItem(DRAFT_KEY,JSON.stringify(projeto));}catch(e){}
  },[projeto]);

  // Autosave no Firestore. Só entra depois que a IA gerou as capas (antes disso o localStorage
  // já cobre) e espera 2,5s parado pra não escrever a cada tecla: a cota do Firebase já estourou
  // uma vez no app de assinaturas por escrita em excesso.
  useEffect(()=>{
    if(!user||!projeto.capas.length) return;
    const snap=JSON.stringify({...projeto,id:null});
    if(snap===ultimoSalvo.current) return;
    clearTimeout(timerSalvar.current);
    timerSalvar.current=setTimeout(()=>salvar(snap),2500);
    return()=>clearTimeout(timerSalvar.current);
  },[projeto,user]);

  async function salvar(snap){
    // Se um save ainda está voando, espera: sem isso dois saves rápidos criariam dois documentos
    if(salvando.current){
      clearTimeout(timerSalvar.current);
      timerSalvar.current=setTimeout(()=>salvar(snap),1500);
      return;
    }
    salvando.current=true;
    setStatusSalvo("salvando");
    const dados={...projeto};
    delete dados.id;
    dados.email=user.email;
    dados.atualizadoEm=firebase.firestore.FieldValue.serverTimestamp();
    try{
      const id=projeto.id||idRef.current;
      if(id){
        await fbDB.collection("projetos").doc(id).set(dados,{merge:true});
      }else{
        dados.criadoEm=firebase.firestore.FieldValue.serverTimestamp();
        const ref=await fbDB.collection("projetos").add(dados);
        idRef.current=ref.id;
        setProjeto(p=>({...p,id:ref.id}));
      }
      ultimoSalvo.current=snap;
      setStatusSalvo("salvo");
    }catch(e){
      setStatusSalvo("erro");
    }
    salvando.current=false;
  }

  function update(patch){setProjeto(p=>({...p,...patch}));}

  function abrirProjeto(p){
    const doc={...p};
    delete doc.atualizadoEm;delete doc.criadoEm;delete doc.email;
    const aberto={...PROJETO_VAZIO,...doc};
    clearTimeout(timerSalvar.current);
    idRef.current=p.id;
    ultimoSalvo.current=JSON.stringify({...aberto,id:null});
    setProjeto(aberto);setFotos({});
    setStep(aberto.slides.length?3:2);
    setStatusSalvo("salvo");setTela("wizard");
  }

  function novo(){
    const naoSalvo=!projeto.id&&!!(projeto.capas.length||projeto.tema.trim());
    if(naoSalvo&&!window.confirm("O carrossel atual ainda não foi salvo. Começar um novo mesmo assim?"))return;
    clearTimeout(timerSalvar.current);
    idRef.current=null;ultimoSalvo.current="";
    setProjeto({...PROJETO_VAZIO});setFotos({});setStep(0);setStatusSalvo("");setTela("wizard");
  }

  if(!authReady) return null;
  if(denied) return <DeniedScreen/>;
  if(!user) return <LoginScreen/>;

  return(
    <div>
      <TopBar step={step} setStep={s=>{setTela("wizard");setStep(s);}} onNovo={novo}
        onProjetos={()=>setTela("projetos")} statusSalvo={statusSalvo}/>
      {tela==="projetos"?(
        <TelaProjetos idAtual={projeto.id} onAbrir={abrirProjeto} onVoltar={()=>setTela("wizard")}/>
      ):(
        <React.Fragment>
          {step===0&&<StepCategoria projeto={projeto} update={update} next={()=>setStep(1)}/>}
          {step===1&&<StepTema projeto={projeto} update={update} next={()=>setStep(2)} back={()=>setStep(0)}/>}
          {step===2&&<StepRoteiro projeto={projeto} update={update} next={()=>setStep(3)} back={()=>setStep(1)}/>}
          {step===3&&<StepSlides projeto={projeto} update={update} fotos={fotos} setFotos={setFotos} back={()=>setStep(2)}/>}
        </React.Fragment>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
